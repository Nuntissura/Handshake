[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2024-0436", # paste
]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]

# SurrealDB's database crates are source-available under BUSL-1.1. Keep these
# exceptions pinned to the exact versions in Cargo.lock so a dependency update
# cannot silently inherit this policy decision.
[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb@3.2.0"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-collections@3.2.0"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-core@3.2.0"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-protocol@0.10.2"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-strand@3.2.0"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-types@3.2.0"

[[licenses.exceptions]]
allow = ["BUSL-1.1"]
crate = "surrealdb-types-derive@3.2.0"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
