[build]
# Keep Cargo artifacts outside the repo to avoid bloating the workspace/Git mirror.
# NOTE: This points to a sibling directory dedicated to this repo (no other files).
target-dir = "../Handshake_Artifacts/handshake-cargo-target"

[env]
# aws-lc-sys otherwise expects a separately installed NASM on Windows. Use
# its supported prebuilt assembly objects while allowing explicit build
# environments to override the setting when needed.
AWS_LC_SYS_PREBUILT_NASM = { value = "1", force = false }
