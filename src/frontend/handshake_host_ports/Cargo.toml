# WP-KERNEL-012 MT-215 — toolkit-free host ports.
#
# One small crate per seam between a desktop host and the parts of Handshake that steer, observe or watch it.
# Both hosts (today's shell and the Vulkan shell) depend on these crates; these crates depend on neither, and no
# GUI toolkit, window library or GPU API may enter their closure (MT-215 AC215-1, HBR-HOST-001).
#
# Standalone workspace root, as every sibling crate tree here: the repo has no root cargo workspace.
[workspace]
resolver = "2"
members = ["ui_heartbeat", "palmistry_launch"]

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
