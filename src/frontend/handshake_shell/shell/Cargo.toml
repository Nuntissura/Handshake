# WP-KERNEL-012 — the shell crate of MT-214 AC214-12: composition only, no widget, pane or domain logic.
#
# Its first part is MT-215 slice 2: the shell's own adapter of the toolkit-free UI heartbeat port (AC215-1, "the new
# shell has its own adapters"), over the window crate's wake lanes and the surface crate's present watches. The shell
# depends on the port; the port depends on neither (MT-215 module_maintenance.dependency_direction). The shell binary
# of MT-214 S5 joins this crate later.
[package]
name = "handshake_shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Composition of the kernel-owned shell: the shell program (startup gate, loop, presenter, input, accessibility, heartbeat, drained shutdown) and the UI heartbeat port bound to its event loop and present path."

[dependencies]
handshake_shell_window = { path = "../window" }
handshake_shell_surface = { path = "../surface" }
handshake_shell_input = { path = "../input" }
handshake_shell_accessibility = { path = "../accessibility" }
ui_heartbeat = { path = "../../handshake_host_ports/ui_heartbeat" }
# MT-214 S5: the program makes the ring's shutdown marker (the heartbeat's own ring writer comes from the caller), and
# opens the GPU owner through the surface crate with the owner's own policy and module types.
handshake-diag-ring = { path = "../../handshake_native/diag_ring" }
handshake-vulkan-renderer = { path = "../../handshake_native/vulkan-renderer" }
# MT-214 S7: the toolkit-free Palmistry launcher (MT-215 AC215-11) and what its signed launch is made of: the embedded
# runtime-instance lease, the ids, the zeroizing seed and the nonce. Exact pins equal the launcher's, so the shell adds no
# second version of any of them.
palmistry_launch = { path = "../../handshake_host_ports/palmistry_launch" }
handshake_runtime_instance = { path = "../../../backend/handshake_runtime_instance" }
uuid = { version = "=1.23.3", features = ["v7"] }
zeroize = "=1.9.0"
rand = "=0.9.4"

[[bin]]
name = "handshake_shell"
path = "src/main.rs"

[target.'cfg(windows)'.dev-dependencies]
# Tests only: the window crate's private desktop. The revision winit 0.30.13 binds, as in the window and surface
# crates.
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
