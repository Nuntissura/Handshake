# WP-KERNEL-012 MT-214 — the kernel-owned native shell, as small crates.
#
# window (S1), surface (S2: the window crate composed with the MT-203 GPU owner), input (S3: typed input with its
# origin, and the input method's composition per text target, over the window crate's events), accessibility (S4: one
# AccessKit tree per window to UI Automation, actions back as typed requests) and shell (MT-214 AC214-12). shell so far
# binds the MT-215 UI heartbeat port to the loop and the present path. Direct Vulkan
# only: no egui, eframe, wgpu or glow may enter any closure, and no window-library, graphics-API or toolkit type any
# public signature (AC214-1, HBR-HOST-001).
#
# Standalone workspace root, as every sibling crate tree here: the repo has no root cargo workspace. The GPU owner
# (`../handshake_native/vulkan-renderer`) is a path dependency of `surface` (and of shell's tests), outside this folder
# and so no member; so is the heartbeat port (`../handshake_host_ports/ui_heartbeat`), a dependency of `shell`.
[workspace]
resolver = "2"
members = ["window", "surface", "input", "accessibility", "shell"]

# accessibility's Windows adapter is the Operator's asset copy of accesskit_windows 0.29.2 (Kumihimo third-party,
# kumihimo-provenance.yaml), at the revision the current application patches in (../handshake_native/Cargo.toml
# [patch.crates-io]). Only accesskit_windows: eframe and egui-wgpu, patched there as well, stay out of this workspace.
[patch.crates-io]
accesskit_windows = { git = "https://github.com/Nuntissura/assets.git", rev = "8eadc5b57dc20d96bf29340f835505ad8ff7cbc8", version = "=0.29.2" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
