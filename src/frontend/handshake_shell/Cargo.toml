# WP-KERNEL-012 MT-214 — the kernel-owned native shell, as small crates.
#
# window (S1, here), then surface, input, accessibility and shell (MT-214 AC214-12). Direct Vulkan only: no egui,
# eframe, wgpu or glow may enter any closure, and no window-library, graphics-API or toolkit type any public
# signature (AC214-1, HBR-HOST-001).
#
# Standalone workspace root, as every sibling crate tree here: the repo has no root cargo workspace.
[workspace]
resolver = "2"
members = ["window"]

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
