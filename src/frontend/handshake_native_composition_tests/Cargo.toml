[package]
name = "handshake_native_composition_tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
handshake-native = { path = "../handshake_native" }
egui_kittest = { version = "0.33", features = ["wgpu", "eframe"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
handshake_core = { path = "../../backend/handshake_core", default-features = false, features = ["runtime-full", "test-utils", "surreal-test-support"] }

[patch.crates-io]
eframe = { git = "https://github.com/Nuntissura/assets.git", rev = "8a97b9ae445872e4143fad1eb92f9ad082017595", version = "=0.33.3" }
egui-wgpu = { git = "https://github.com/Nuntissura/assets.git", rev = "8a97b9ae445872e4143fad1eb92f9ad082017595", version = "=0.33.3" }
accesskit_windows = { git = "https://github.com/Nuntissura/assets.git", rev = "8a97b9ae445872e4143fad1eb92f9ad082017595", version = "=0.29.2" }
