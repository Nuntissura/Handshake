[workspace]

[package]
name = "handshake_ckc_moodboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
jsonschema = { version = "0.17", features = ["draft202012"] }
