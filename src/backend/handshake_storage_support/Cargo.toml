[package]
name = "handshake_storage_support"
version = "0.1.0"
edition = "2021"
license = "MIT"
[features]
surreal-test-support = []
[dependencies]
thiserror = "2.0.17"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
getrandom = "0.2"

[dev-dependencies]
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
