[package]
name = "handshake_document"
version = "0.1.0"
edition = "2021"
license = "MIT"
[features]
surreal-test-support = ["handshake_storage_support/surreal-test-support"]
[dependencies]
handshake_storage_support = { path = "../handshake_storage_support" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "v7", "fast-rng", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0.17"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
surrealdb-types = "=3.2.0"
