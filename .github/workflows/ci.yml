name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.18.4"
  OSV_SCANNER_VERSION: "1.7.0"
  SYFT_VERSION: "0.105.0"
  SCANCODE_TOOLKIT_VERSION: "32.2.1"
  # Keep all Rust build/test artifacts out of the repo working tree.
  CARGO_TARGET_DIR: "${{ github.workspace }}/../Handshake Artifacts/handshake-cargo-target"
  # The embedded SurrealDB test backend refuses to start without an absolute
  # artifacts root and confines every test store beneath it.
  HANDSHAKE_ARTIFACTS_ROOT: "${{ github.workspace }}/../Handshake_Artifacts"

jobs:
  governance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install ripgrep and Linux build deps (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep libdbus-1-dev pkg-config

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y
          }

      - name: Governance check
        run: just gov-check

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm -C app install --frozen-lockfile

      - name: Install ripgrep and Linux build deps
        run: sudo apt-get update && sudo apt-get install -y ripgrep libdbus-1-dev pkg-config

      - name: Docs check
        run: |
          test -s .GOV/roles_shared/docs/START_HERE.md
          test -s .GOV/spec/SPEC_CURRENT.md
          test -s .GOV/roles_shared/docs/ARCHITECTURE.md
          test -s .GOV/roles_shared/docs/RUNBOOK_DEBUG.md
          test -s .GOV/reference/PAST_WORK_INDEX.md

      - name: Codex checks
        run: |
          echo "Disallow direct fetch in app/src (outside lib/api.ts)..."
          rg -n "\\bfetch\\s*\\(" app/src | rg -v "app/src/lib/api.ts" && exit 1 || exit 0
          echo "Disallow println!/eprintln! in backend..."
          rg -n "eprintln!|println!" src/backend/handshake_core/src && exit 1 || exit 0
          echo "Hard boundary: product code must not reference .GOV/ ..."
          rg -n "\\.GOV[/\\\\]" app/src src/backend/handshake_core/src src/backend/handshake_core/tests && exit 1 || exit 0
          echo "Docs must not reference legacy Codex versions (v0.5-v0.7)..."
          rg -n "Codex v0\\.5|Codex v0\\.6|Codex v0\\.7|Handshake Codex v0\\.5|Handshake Codex v0\\.6|Handshake Codex v0\\.7" .GOV --glob '!.GOV/task_packets/**' --glob '!.GOV/refinements/**' && exit 1 || exit 0
          rg -n "Codex v0\\.5|Codex v0\\.6|Codex v0\\.7|Handshake Codex v0\\.5|Handshake Codex v0\\.6|Handshake Codex v0\\.7" .GOV/task_packets/README.md && exit 1 || exit 0
          echo "SPEC_CURRENT must reference latest master spec..."
          node .GOV/roles_shared/scripts/spec-current-check.mjs
          echo "Task Board entries must be minimal..."
          node .GOV/roles_shared/checks/task-board-check.mjs
          echo "In Progress task packets must include coder claim fields..."
          node .GOV/roles_shared/checks/task-packet-claim-check.mjs
          echo "TODOs must include HSK issue tags..."
          rg -n --pcre2 "TODO(?!\\(HSK-\\d+\\))" app/src src/backend .GOV/roles .GOV/roles_shared .GOV/tools --glob "!.GOV/roles_shared/scripts/fixtures/**" --glob "!.GOV/roles_shared/scripts/dev/codex-check-test.mjs" && exit 1 || exit 0

      - name: Git hygiene (build/cache artifacts)
        run: node .GOV/roles/validator/checks/validator-git-hygiene.mjs

      - name: Codex check tests
        run: node .GOV/roles_shared/scripts/dev/codex-check-test.mjs

      - name: Frontend lint
        run: pnpm -C app run lint

      - name: Frontend architecture (dependency-cruiser)
        run: pnpm -C app run depcruise

      - name: Frontend tests
        run: pnpm -C app test

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt check
        working-directory: src/backend/handshake_core
        run: cargo fmt -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src/backend/handshake_core/Cargo.toml --all-targets --all-features

      - name: Rust tests
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml

  backend-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Prepare embedded artifacts root
        run: mkdir -p "${{ github.workspace }}/../Handshake_Artifacts"

      - name: Storage conformance tests
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --tests storage_conformance

      - name: MCP e2e tests (durable progress mapping)
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --tests mcp_e2e_tests

  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.4"

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          # At v8.18.4 the module still declares its path as zricethezav/gitleaks;
          # requiring it as gitleaks/gitleaks is a version-constraint conflict.
          go install github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}
          GOPATH_BIN="$(go env GOPATH)/bin"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          export PATH="$GOPATH_BIN:$PATH"
          gitleaks version

      - name: Run supply-chain MEX (secret_scan)
        env:
          HSK_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --features duckdb-flight-recorder,test-utils --test mex_tests ci_secret_scan_runs_via_terminal_service -- --ignored

      - name: Upload supply-chain artifacts + Flight Recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mex_supply_chain_secret_scan
          path: data/mex_supply_chain
          if-no-files-found: warn

  vuln_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.4"

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install osv-scanner (pinned)
        run: |
          set -euo pipefail
          go install github.com/google/osv-scanner/cmd/osv-scanner@v${OSV_SCANNER_VERSION}
          GOPATH_BIN="$(go env GOPATH)/bin"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          export PATH="$GOPATH_BIN:$PATH"
          osv-scanner --version

      - name: Run supply-chain MEX (vuln_scan)
        env:
          HSK_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --features duckdb-flight-recorder,test-utils --test mex_tests ci_vuln_scan_runs_via_terminal_service -- --ignored

      - name: Upload supply-chain artifacts + Flight Recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mex_supply_chain_vuln_scan
          path: data/mex_supply_chain
          if-no-files-found: warn

  sbom_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.4"

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install syft (pinned)
        run: |
          set -euo pipefail
          # syft cannot be go install-ed: its go.mod carries replace directives,
          # which go install rejects. Use the pinned release binary instead.
          SYFT_BIN="$RUNNER_TEMP/syft-bin"
          mkdir -p "$SYFT_BIN"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$SYFT_BIN" syft
          echo "$SYFT_BIN" >> "$GITHUB_PATH"
          export PATH="$SYFT_BIN:$PATH"
          syft version

      - name: Run supply-chain MEX (sbom_generate)
        env:
          HSK_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --features duckdb-flight-recorder,test-utils --test mex_tests ci_sbom_generate_runs_via_terminal_service -- --ignored

      - name: Upload supply-chain artifacts + Flight Recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mex_supply_chain_sbom_generate
          path: data/mex_supply_chain
          if-no-files-found: warn

  license_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install scancode-toolkit (pinned)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "scancode-toolkit==${SCANCODE_TOOLKIT_VERSION}"
          scancode --version

      - name: Run supply-chain MEX (license_scan)
        env:
          HSK_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --features duckdb-flight-recorder,test-utils --test mex_tests ci_license_scan_runs_via_terminal_service -- --ignored

      - name: Upload supply-chain artifacts + Flight Recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mex_supply_chain_license_scan
          path: data/mex_supply_chain
          if-no-files-found: warn

  dependency_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm -C app install --frozen-lockfile

      - name: Frontend audit
        run: pnpm -C app audit --audit-level high

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Rust dependency policy
        run: cargo deny --manifest-path src/backend/handshake_core/Cargo.toml check advisories licenses bans sources

  cross-platform-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # Deliberately scoped to the library and binaries plus the in-crate test
      # layer. --all-targets would also compile src/backend/handshake_core/tests/**,
      # which MT-141 owns and which does not currently compile at all: tempfile
      # resolves to 3.27.0, where TempDir::from_path no longer exists
      # (tests/atelier_surreal_support/mod.rs:124). Including it here would make
      # this job report another microtask defect instead of the build result.
      - name: Cross-platform build check (Linux)
        run: cargo check --manifest-path src/backend/handshake_core/Cargo.toml --lib --bins --all-features

      - name: Cross-platform in-crate test-layer compile (Linux)
        run: cargo test --manifest-path src/backend/handshake_core/Cargo.toml --lib --all-features --no-run

  traceability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Need commit history for traceability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Traceability check
        run: node .GOV/roles_shared/checks/ci-traceability-check.mjs

