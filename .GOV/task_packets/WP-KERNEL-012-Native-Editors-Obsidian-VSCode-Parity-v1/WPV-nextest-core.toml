[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
test-threads = 1

# MT-164 AC-164-4 / MT-166 AC-166-4 timing medians and the MT-138 Atelier pin (both stores) printed on success.
[[profile.default.overrides]]
filter = 'test(=storage::surreal::resource_authority_tests::grant_check_cost_is_independent_of_grant_count) | test(=storage::surreal::resource_authority_tests::resource_select_and_ledger_access_cost_is_independent_of_grant_count) | test(=storage::surreal::schema::tests::mt138_canonical_atelier_catalog_fingerprint_matches_compiled_pin)'
success-output = "final"

# MT-167 AC-167-3: print the MT167_TIMING / MT167_TIMING_SUMMARY lines on success, and allow the full
# 1 warm-up + 5 timed requests x 2 shapes (each request bounded at 45 s by the test) before terminating.
[[profile.default.overrides]]
filter = 'test(/^mt167_/)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 12 }

[[profile.default.overrides]]
filter = 'test(=mt170_wikilink_to_standalone_loom_block_projects_one_mention_edge)'
success-output = "final"

# MT-168 timing proof requires printed medians and its contracted 1200 s budget.
[[profile.default.overrides]]
filter = 'test(=storage::surreal::resource_authority_tests::grant_check_cost_is_independent_of_unrelated_grant_rows) | test(=storage::surreal::resource_authority_tests::authority_checks_cost_is_independent_of_unrelated_grant_rows) | test(=storage::surreal::resource_authority_tests::loom_block_and_source_read_cost_is_independent_of_unrelated_grant_rows)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.default.junit]
path = "junit.xml"
