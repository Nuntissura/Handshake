[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
test-threads = 1

# MT-164 AC-164-4 / MT-166 AC-166-4 timing medians and the MT-138 Atelier pin (both stores) printed on success.
[[profile.default.overrides]]
filter = 'test(=storage::surreal::resource_authority_tests::grant_check_cost_is_independent_of_grant_count) | test(=storage::surreal::resource_authority_tests::resource_select_and_ledger_access_cost_is_independent_of_grant_count) | test(=storage::surreal::schema::tests::mt138_canonical_atelier_catalog_fingerprint_matches_compiled_pin)'
success-output = "final"

# MT-167 AC-167-3: print the MT167_TIMING / MT167_TIMING_SUMMARY lines on success, and allow the full
# 1 warm-up + 5 timed requests x 2 shapes (each request bounded at 45 s by the test) before terminating.
[[profile.default.overrides]]
filter = 'binary(=mt167_code_nav_index_cost_tests)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 12 }

[profile.default.junit]
path = "junit.xml"
