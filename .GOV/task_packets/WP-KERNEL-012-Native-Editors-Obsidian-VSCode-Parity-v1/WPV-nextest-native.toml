[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
test-threads = 1

[profile.default.junit]
path = "junit.xml"

# The owned-backend proofs (require_live_backend / require_reachable_backend,
# via start_product_backend in backend_proof_support/mod.rs) share ONE global
# file lock (<artifacts>/managed-backend-fixture.lock) held for each test's
# whole run; a waiter may queue up to FIXTURE_LOCK_TIMEOUT = 1200s
# (backend_proof_support/mod.rs:53, :593). Under the default 60s/terminate-after=5
# profile this produced 7 TIMEOUTs in run51b (2026-09-24) - not hangs, just
# lock-queue waits exceeding 60s x5=300s. Serialize these binaries into one
# test-group (max-threads=1, so nextest never even tries to run two of them
# concurrently) with a slow-timeout matching FIXTURE_LOCK_TIMEOUT so a genuine
# long wait is not misreported as a failure, while terminate-after=1 still
# catches a true hang. Only binaries that call require_live_backend() or
# require_reachable_backend() belong here. MT-008's test_code_nav_client and
# test_completion_hover_accesskit use mt008_code_nav_support, which calls
# require_live_backend() for their live proofs. Global test-threads remains 1.
[test-groups.owned-backend]
max-threads = 1

