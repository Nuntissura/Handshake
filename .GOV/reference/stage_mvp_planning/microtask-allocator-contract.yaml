stage_microtask_allocator_contract:
  schema_id: hsk.stage_microtask_allocator_contract@1
  allocator_id: stage-microtask-allocator
  authority: NON_AUTHORITATIVE_REFERENCE
  status: SPECIFIED_UNBOUND
  updated_at: "2026-07-19"
  wp_id: WP-1-Handshake-Stage-MVP-v1
  purpose: >-
    Deterministically compile the later approved Stage requirement, acceptance,
    topology, dependency, and release graph into official machine-readable
    Handshake microtask contracts. This planning contract is not an alternative
    microtask authority and cannot create or activate official microtasks by itself.

canonical_output:
  schema_id: hsk.microtask_contract@1
  schema_path: .GOV/roles_shared/schemas/MICRO_TASK_CONTRACT.schema.json
  template_path: .GOV/templates/MICRO_TASK_CONTRACT_TEMPLATE.json
  contract_pattern: .GOV/task_packets/WP-1-Handshake-Stage-MVP-v1/MT-###.json
  projection_pattern: .GOV/task_packets/WP-1-Handshake-Stage-MVP-v1/MT-###.md
  packet_contract: .GOV/task_packets/WP-1-Handshake-Stage-MVP-v1/packet.json
  contract_authority: PRIMARY_MACHINE_READABLE
  projection_authority: GENERATED_NON_AUTHORITATIVE
  projection_rule: >-
    The Markdown file is generated only on demand or when contract-bound, cites
    the JSON source hash, and cannot activate work or override the JSON contract.

required_inputs:
  - { id: STAGE-ALLOC-IN-001, path: .GOV/reference/stage_mvp_planning/requirements-and-traceability.yaml, required_state: every_requirement_resolved_exactly_once }
  - { id: STAGE-ALLOC-IN-002, path: .GOV/reference/stage_mvp_planning/acceptance-registry.yaml, required_state: all_117_atomic_rows_valid }
  - { id: STAGE-ALLOC-IN-003, path: .GOV/reference/stage_mvp_planning/acceptance/, required_state: every_requirement_has_positive_negative_failure_and_evidence_cases }
  - { id: STAGE-ALLOC-IN-004, path: .GOV/reference/stage_mvp_planning/production-gates.yaml, required_state: graph_valid_commands_bound_before_execution }
  - { id: STAGE-ALLOC-IN-005, path: .GOV/reference/stage_mvp_planning/dependency-gates.yaml, required_state: every_external_dependency_has_exact_entry_and_unavailable_contract }
  - { id: STAGE-ALLOC-IN-006, path: .GOV/reference/stage_mvp_planning/pillar-compatibility-matrix.yaml, required_state: all_24_pillars_have_explicit_disposition_and_edge_resolution }
  - { id: STAGE-ALLOC-IN-007, path: .GOV/reference/stage_mvp_planning/legacy-stage-disposition-register.yaml, required_state: exact_baseline_inventory_no_catchall_closure }
  - { id: STAGE-ALLOC-IN-008, path: .GOV/reference/stage_mvp_planning/15-product-topology-and-active-wp-migration.md, required_state: exact_owned_shared_forbidden_reference_paths_bound }
  - { id: STAGE-ALLOC-IN-009, path: .GOV/reference/stage_mvp_planning/planning-readiness.yaml, required_state: operator_decisions_locked_and_authority_pass_started }
  - { id: STAGE-ALLOC-IN-010, path: .GOV/task_packets/WP-1-Handshake-Stage-MVP-v1/packet.json, required_state: later_approved_packet_contract_exists }

generation_preconditions:
  all_required: true
  conditions:
    - "The operator has explicitly started the later Master Spec/WP/MT authority pass."
    - "The current Master Spec Stage topic and approved refinement exist and pass their canonical validators."
    - "The replacement Stage packet has one approved exact integration baseline."
    - "Every input ID, requirement, source, decision, spec anchor, pillar edge, acceptance row, release, production gate, dependency gate, evidence type, and path resolves."
    - "Every legacy Stage surface has an exact disposition; a catchall row is not closure evidence."
    - "Every external dependency is either PASS at the exact approved baseline or assigned to an explicit prerequisite MT that can close it without pretending Stage already consumes it."
    - "All generated contracts pass the canonical microtask schema and packet-local validators before activation."

deterministic_allocation:
  ordering:
    - topological_wave
    - lane_numeric_order
    - dependency_gate_order
    - requirement_id_lexical_order
    - closure_unit_lexical_tiebreak
  id_policy:
    pattern: MT-###
    start: MT-001
    contiguous: true
    reuse_retired_id: false
    allocation_receipt_required: true
  atomicity_rule: >-
    One microtask has one externally provable closure unit and one primary proof
    target. Multiple requirements may share that task only when the same code or
    contract change and the same validator verdict close them together.
  split_triggers:
    - more_than_one_independently_reviewable_runtime_result
    - more_than_one_primary_proof_target_without_recorded_indivisibility
    - independent_rollback_boundaries
    - independent_dependency_entry_gates
    - independent_file_conflict_owners
    - implementation_and_unrelated_governance_or_documentation
  dependency_policy: >-
    A generated dependency edge must follow the requirement, topology, release,
    or external-gate graph. Convenience ordering is not a dependency. The final
    graph must be acyclic and every blocks edge must be the reverse of a depends_on edge.

canonical_field_mapping:
  - { planning_field: wp_id, output_field: wp_id, rule: exact_approved_replacement_packet_id }
  - { planning_field: allocated_mt_id, output_field: mt_id, rule: contiguous_allocator_id }
  - { planning_field: dependencies, output_field: lifecycle.depends_on, rule: exact_official_mt_ids }
  - { planning_field: blocks, output_field: lifecycle.blocks, rule: exact_reverse_edges }
  - { planning_field: lifecycle_state, output_field: lifecycle.status, rule: starts_PENDING }
  - { planning_field: closure_unit, output_field: scope.summary, rule: one_externally_provable_result }
  - { planning_field: owned_and_shared_paths, output_field: scope.allowed_paths, rule: repo_relative_exact_paths_or_narrow_globs }
  - { planning_field: forbidden_paths, output_field: scope.forbidden_paths, rule: repo_relative_exact_paths_or_narrow_globs }
  - { planning_field: acceptance_rows, output_field: scope.acceptance_criteria, rule: exact_acceptance_ids_and_closure_text }
  - { planning_field: primary_proof_target, output_field: scope.proof_targets, rule: exactly_one_unless_indivisibility_is_recorded }
  - { planning_field: path_ownership, output_field: file_ownership, rule: owned_shared_reference_forbidden_and_merge_owner }
  - { planning_field: trace_graph, output_field: traceability, rule: requirement_source_decision_spec_pillar_acceptance_release_and_gate_ids }
  - { planning_field: tests_and_evidence, output_field: verification, rule: exact_commands_zero_match_guards_fixtures_outputs_and_freshness }
  - { planning_field: external_gates, output_field: external_dependency_gates, rule: dependency_gate_ids_and_required_state }
  - { planning_field: rollback, output_field: rollback_or_compensation, rule: executable_or_typed_not_applicable_with_reason }
  - { planning_field: diagnostics, output_field: diagnostic_obligations, rule: structured_state_logs_traces_health_error_and_reproduction_evidence }
  - { planning_field: user_manual, output_field: user_manual_obligation, rule: canonical_template_shape }
  - { planning_field: gui_and_argus, output_field: gui_obligation, rule: canonical_template_shape_with_explicit_not_applicable_reason }
  - { planning_field: hbr, output_field: hbr_obligations_and_hbr_int_009_tier_obligations, rule: project_authority_resolved }
  - { planning_field: handoff_and_status, output_field: handoff_and_status_sync, rule: canonical_receipts_validator_and_transaction_surfaces }
  - { planning_field: risks_and_failures, output_field: red_team, rule: canonical_required_profile_plus_task_specific_risks_and_controls }

generated_contract_template:
  schema_id: hsk.microtask_contract@1
  schema_version: microtask_contract_v1
  contract_authority: PRIMARY_MACHINE_READABLE
  artifact_policy:
    authority_surface: MACHINE_CONTRACT
    legacy_markdown_policy: SAFETY_NET_ONLY_DO_NOT_COPY_FORWARD
    projection_creation: ON_DEMAND_OR_CONTRACT_BOUND
    operator_facing_authority: false
    model_created_markdown_authority_allowed: false
    allowed_markdown_exceptions: [operator_created_notes, operator_created_research, operator_created_audits, explicit_on_demand_projection, explicit_report_projection_contract, frozen_legacy_migration_reference]
  wp_id: WP-1-Handshake-Stage-MVP-v1
