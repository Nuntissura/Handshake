    profile: DETERMINISTIC_CONTRACT_MIGRATION_V1
    risks: []
    minimum_controls: []

required_conflict_groups:
  - { id: STAGE-CONFLICT-NATIVE-SHELL, surfaces: [native-application-entrypoint, shell-registry, module-registry] }
  - { id: STAGE-CONFLICT-BACKEND-ROUTING, surfaces: [backend-lib, api-routing, command-registry] }
  - { id: STAGE-CONFLICT-CONTRACT-REGISTRIES, surfaces: [event-registry, capability-registry, error-registry] }
  - { id: STAGE-CONFLICT-MIGRATIONS, surfaces: [database-migration-numbers, schema-version-registry] }
  - { id: STAGE-CONFLICT-WORKSPACE, surfaces: [workspace-manifest, cargo-manifests, dependency-lock] }
  - { id: STAGE-CONFLICT-MANUAL, surfaces: [user-manual-registry, in-app-help-index] }
  - { id: STAGE-CONFLICT-DIAGNOSTICS, surfaces: [diagnostic-registry, health-registry, argus-surface-registry] }
  - { id: STAGE-CONFLICT-EVIDENCE, surfaces: [fixture-registry, evidence-registry, validator-command-registry] }
  - { id: STAGE-CONFLICT-PACKAGING, surfaces: [release-packaging, installer-update-manifest, supply-chain-records] }

allocator_rejections:
  - { id: STAGE-ALLOC-REJECT-001, condition: duplicate_gapped_reversed_or_reused_mt_ids }
  - { id: STAGE-ALLOC-REJECT-002, condition: orphan_or_unknown_requirement_source_decision_spec_pillar_acceptance_release_gate_evidence_or_path_reference }
  - { id: STAGE-ALLOC-REJECT-003, condition: any_requirement_not_covered_exactly_once_by_primary_acceptance_ownership }
  - { id: STAGE-ALLOC-REJECT-004, condition: dependency_cycle_self_edge_or_blocks_reverse_edge_mismatch }
  - { id: STAGE-ALLOC-REJECT-005, condition: undeclared_file_overlap_or_concurrent_shared_file_ownership_without_one_merge_owner }
  - { id: STAGE-ALLOC-REJECT-006, condition: migration_number_collision_or_unreserved_migration_range }
  - { id: STAGE-ALLOC-REJECT-007, condition: unbound_external_dependency_gate_or_dependency_pass_from_dirty_unhashed_stale_or_wrong_commit_evidence }
  - { id: STAGE-ALLOC-REJECT-008, condition: verification_command_missing_exact_binding_or_zero_match_guard }
  - { id: STAGE-ALLOC-REJECT-009, condition: acceptance_missing_positive_negative_failure_recovery_or_fresh_evidence_case }
  - { id: STAGE-ALLOC-REJECT-010, condition: evidence_missing_build_fixture_dependency_version_commit_environment_or_timestamp_binding }
  - { id: STAGE-ALLOC-REJECT-011, condition: legacy_stage_compatibility_alias_reader_writer_route_schema_or_mock_leakage_not_explicitly_selected_by_current_contract }
  - { id: STAGE-ALLOC-REJECT-012, condition: legacy_disposition_catchall_used_as_exact_inventory_closure }
  - { id: STAGE-ALLOC-REJECT-013, condition: non_atomic_closure_unit_multiple_primary_proof_targets_or_independent_rollback_boundaries }
  - { id: STAGE-ALLOC-REJECT-014, condition: canonical_schema_template_or_packet_local_validator_failure }
  - { id: STAGE-ALLOC-REJECT-015, condition: missing_explicit_disposition_or_edge_resolution_for_any_of_24_pillars }
  - { id: STAGE-ALLOC-REJECT-016, condition: release_root_can_close_without_all_mandatory_predecessor_gates }
  - { id: STAGE-ALLOC-REJECT-017, condition: generated_projection_source_hash_mismatch_or_projection_used_as_authority }
  - { id: STAGE-ALLOC-REJECT-018, condition: gui_manual_diagnostics_hbr_red_team_handoff_or_status_sync_obligation_missing_or_unresolved }
  - { id: STAGE-ALLOC-REJECT-019, condition: absolute_machine_local_path_or_non_portable_command }
  - { id: STAGE-ALLOC-REJECT-020, condition: task_activation_before_packet_validator_and_allocator_receipt_pass }

status_sync_transaction:
  canonical_source: official_microtask_json_and_packet_contract
  surfaces:
    - official_microtask_contract
    - packet_mt_index
    - work_packet_aggregate
    - taskboard_row
    - build_order
    - traceability_registry
    - dependency_gate_registry
    - validator_projections
  required_input: validator_verdict_or_operator_authority_receipt
  atomicity: all_or_detected_partial_failure
  partial_failure_behavior: no_completion_claim_repair_from_canonical_contract
  command_id: UNBOUND_FUTURE_AUTHORITY_PASS
  repair_command_id: UNBOUND_FUTURE_AUTHORITY_PASS

