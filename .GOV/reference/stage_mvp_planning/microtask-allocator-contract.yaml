  lifecycle: { status: PENDING, depends_on: [], blocks: [], active: false, validator_verdict: PENDING }
  scope: { summary: ALLOCATED_CLOSURE_UNIT, allowed_paths: [], forbidden_paths: [], acceptance_criteria: [], proof_targets: [] }
  file_ownership: { owned_paths: [], shared_paths: [], reference_paths: [], forbidden_paths: [], merge_owner: UNBOUND, conflict_groups: [] }
  traceability: { requirement_ids: [], source_ids: [], decision_ids: [], spec_anchor_ids: [], pillar_edge_ids: [], acceptance_ids: [], release_ids: [], production_gate_ids: [] }
  external_dependency_gates: []
  verification: { command_ids: [], zero_match_guards: [], fixture_ids: [], evidence_outputs: [], freshness_contract: UNBOUND }
  rollback_or_compensation: { steps: [], not_applicable_reason: null }
  diagnostic_obligations: []
  gui_obligation:
    operator_surface_required: UNBOUND
    gui_creation_required: UNBOUND
    argus_required: UNBOUND
    trace_projection_required_when_non_ui: true
    surfaces: []
    argus_targets: []
    expected_evidence: [argus_inspect_or_accesskit_tree, argus_screenshot_or_snapshot_reference, renderer_console_error_scan, layout_overlap_state_check, capture_matrix_or_recorded_not_applicable_reason]
    not_applicable_reason: null
