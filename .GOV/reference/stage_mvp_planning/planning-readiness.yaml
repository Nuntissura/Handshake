locked_operator_decisions:
  - id: STAGE-DEC-017
    resolution: >-
      The current Stage direction supersedes every older Stage-specific
      requirement, implementation, prototype, adapter, connector, route,
      pane, schema, mockup, and test surface regardless of build status. Old
      assets are lineage/evidence or optional salvage only; real operator data
      receives an explicit non-loss disposition without legacy runtime authority.
    evidence: .GOV/reference/stage_mvp_planning/02-decision-register.md
  - id: STAGE-OPEN-DEC-003
    resolution: >-
      RESOLVED_BY_STAGE_DEC_017: the new full Stage module is canonical. The
      WP-12 Stage pane, ModuleId placeholder, routes, adapters, connectors,
      wire types, schemas, and mockups are superseded rather than retained as
      compatibility surfaces. Any editor integration is specified anew.
    evidence: .GOV/reference/stage_mvp_planning/02-decision-register.md
  - id: STAGE-DEC-018
    resolution: >-
      Keep ArtifactStore as shared global Handshake infrastructure. Stage uses
      the Stage Capture product/process name and StageCaptureCoordinator,
      consumes shared opaque ArtifactHandles, and creates no Stage-specific
      byte store or handle encoding.
    evidence: .GOV/reference/stage_mvp_planning/02-decision-register.md

operator_decisions_required_before_authority_authoring:
  - id: STAGE-OPEN-DEC-001
    question: >-
      Approve the non-deceptive release split: production-qualified WebView2
      Windows slice may ship without closing the Servo-strategic umbrella WP.
    blocks: [future-master-spec, future-refinement, future-wp-closure-semantics]
    default: NONE
  - id: STAGE-OPEN-DEC-002
    question: >-
      Select the supported authenticated YouTube/Google path or approve an
      explicit limitation; embedded WebView2 Google authentication is blocked.
    blocks: [STAGE-GATE-007-AUTH-COMPATIBILITY, STAGE-GATE-018-WEBVIEW2-PRODUCTION]
    default: NONE
  - id: STAGE-OPEN-DEC-004
    question: >-
      Confirm the project-wide Windows installer/update/signing baseline to
      which Stage engine/runtime assets must conform.
    blocks: [STAGE-GATE-016-PACKAGE-SUPPLY-CHAIN]
    default: NONE
  - id: STAGE-OPEN-DEC-005
    question: >-
      Lock numerical performance, resource, compatibility, RPO/RTO, evidence
      freshness, and support targets after measured baselines.
    blocks: [STAGE-GATE-009-HIGH-VOLUME, STAGE-GATE-014-BACKUP-RESTORE]
    default: NONE

