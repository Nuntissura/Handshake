  preconditions:
  - target-build-bound
  - exact-noninteractive-command-bound
  - system-fault-matrix-fixture-bound
  - bound-build-id
  - bound-fixture-id
  - bound-command-id
  - bound-fault-id
  - bound-injection-point
  - bound-occurred-at
  fixture_ids:
  - STAGE-FIX-RECOVERY-003
  command_ids:
  - UNBOUND
  cases:
    positive:
    - Every declared fault is reproducibly injected at pre-write, mid-write, post-write, and restart boundaries where applicable and produces
      the expected typed result.
    negative:
    - No injected fault may be swallowed, converted to success, repaired by destructive reinitialization, or contaminate another profile/session.
    failure_recovery:
    - Restart and retry reconcile partial effects idempotently, or enter safe mode with the exact unresolved records and operator choices visible.
    concurrency:
    - Overlapping disk, memory, database, and migration faults serialize or fence recovery so one repair cannot overwrite another fault's unresolved
      state.
  evidence_types:
  - system-fault-matrix
  - fault-injection-results
  - invariant-report
  - restart-reconciliation
  - safe-mode-receipts
