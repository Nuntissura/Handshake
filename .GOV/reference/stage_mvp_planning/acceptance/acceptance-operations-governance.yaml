  - target-build-bound
  - exact-noninteractive-command-bound
  - clean-machine-restore-fixture-bound
  - bound-build-id
  - bound-backup-format-version
  - bound-fixture-id
  - bound-command-id
  - bound-occurred-at
  fixture_ids:
  - STAGE-FIX-RECOVERY-004
  command_ids:
  - UNBOUND
  cases:
    positive:
    - Restore a versioned backup on a clean machine and reconcile record counts, hashes, lineage, profiles, and a 3000-tab dormant session without
      eager renderer startup.
    negative:
    - Missing, stale, or corrupt live UDF data cannot override canonical records or cause the restore to report complete.
    failure_recovery:
    - Interrupted or partially corrupt restore resumes idempotently or reports exact losses while preserving the source backup and already verified
      objects.
    concurrency:
    - Writes concurrent with backup are excluded or captured by a declared snapshot watermark, and restore reconciles only the canonical committed
      set.
  evidence_types:
