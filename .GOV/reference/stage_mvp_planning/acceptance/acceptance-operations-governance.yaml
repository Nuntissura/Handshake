- id: STAGE-ACC-RECOVERY-004
  title: Canonical clean-machine restore
  closure_unit: A clean-machine restore reconstructs canonical Stage records and ArtifactStore references before rematerializing runtime profiles;
    live browser UDF files are never required as backup authority.
  requirement_ids:
  - STAGE-REQ-RECOVERY-004
  source_ids:
  - STAGE-PRES-PORT-001
  - STAGE-PRES-PORT-003
  release_ids:
  - STAGE-WIN-BOOTSTRAP-PROD
  - STAGE-WP-COMPLETE
