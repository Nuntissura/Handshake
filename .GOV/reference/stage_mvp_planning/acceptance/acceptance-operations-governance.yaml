acceptance:
- id: STAGE-ACC-RECOVERY-001
  title: Deduplicated bounded process recovery
  closure_unit: Each browser, renderer, GPU, network, profile, and host failure enters one deduplicated typed state machine, applies a bounded
    retry policy, and reaches recovered, quarantined, or explicit failed state.
  requirement_ids:
  - STAGE-REQ-RECOVERY-001
  source_ids:
  - STAGE-PRES-MVP-010
  - STAGE-PRES-ASR-003
  - STAGE-SPEC-010
  - STAGE-SPEC-018
  release_ids:
  - STAGE-WIN-BOOTSTRAP-PROD
  - STAGE-WP-COMPLETE
  production_gate_ids:
  - STAGE-GATE-013-FAILURE-RECOVERY
  dependency_gate_ids: []
  owner_lane: L21
  preconditions:
  - target-build-bound
  - exact-noninteractive-command-bound
  - process-failure-injection-fixture-bound
  - bound-build-id
  - bound-fixture-id
  - bound-command-id
  - bound-process-class
  - bound-occurred-at
  fixture_ids:
  - STAGE-FIX-RECOVERY-001
  command_ids:
  - UNBOUND
  cases:
    positive:
    - Inject each process class failure and prove one attributable transition sequence, bounded retry count, and stable recovered state.
    negative:
    - Duplicate or reordered failure signals cannot create parallel recovery loops, duplicate replacement processes, or false recovered status.
    failure_recovery:
    - Exhausting the retry budget stops automatic work, preserves canonical tab/session state, and exposes an operator recovery action.
    concurrency:
    - Simultaneous duplicate failure signals and failures in separate process classes retain per-target attribution, share only the intended retry
      budget, and create no duplicate recovery worker.
  evidence_types:
  - process-failure-injection
  - typed-transition-log
  - retry-counter-report
  - final-state-receipt
  freshness_policy:
    max_age: release-run
    revalidation_triggers:
    - process-failure-injection-contract-change
    - target-build-change
    - fixture-change
  pass_rule:
    selected_min: 1
    executed_min: 1
    skipped_only_invalid: true
    cleanup_required: true
    redaction_scan_required: true
  status: SPECIFIED_UNBOUND
- id: STAGE-ACC-RECOVERY-002
  title: Crash-loop quarantine and safe mode
  closure_unit: Repeated startup or renderer crashes trip a deterministic loop breaker, quarantine the failing scope, offer safe-mode restore
    choices, and remove or report every orphan.
  requirement_ids:
  - STAGE-REQ-RECOVERY-002
  source_ids: []
  release_ids:
  - STAGE-WIN-BOOTSTRAP-PROD
  - STAGE-WP-COMPLETE
  production_gate_ids:
  - STAGE-GATE-013-FAILURE-RECOVERY
  dependency_gate_ids: []
  owner_lane: L21
  preconditions:
  - target-build-bound
  - exact-noninteractive-command-bound
  - crash-loop-safe-mode-fixture-bound
  - bound-build-id
  - bound-fixture-id
  - bound-command-id
  - bound-threshold-policy
  - bound-occurred-at
  fixture_ids:
  - STAGE-FIX-RECOVERY-002
  command_ids:
  - UNBOUND
  cases:
    positive:
    - A threshold-crossing crash sequence enters safe mode, identifies the quarantined scope, and completes the selected restore journey without
      re-triggering the loop.
    negative:
    - A single transient crash does not trip global safe mode, while repeated crashes cannot bypass the breaker through restart timing or window
      duplication.
    failure_recovery:
    - If safe-mode restore also fails, Stage remains usable in bounded recovery mode and provides retry, export, reset, and diagnostics choices
      without deleting canonical state.
    concurrency:
    - Concurrent windows crossing the crash threshold elect one breaker decision and one quarantine record without repeatedly relaunching the
      failing scope.
  evidence_types:
  - crash-loop-safe-mode
  - crash-sequence
  - breaker-receipt
  - quarantine-manifest
  - orphan-cleanup-report
  - visual-journey
  freshness_policy:
    max_age: release-run
    revalidation_triggers:
    - crash-loop-safe-mode-contract-change
    - target-build-change
    - fixture-change
  pass_rule:
    selected_min: 1
    executed_min: 1
    skipped_only_invalid: true
    cleanup_required: true
    redaction_scan_required: true
  status: SPECIFIED_UNBOUND
- id: STAGE-ACC-RECOVERY-003
  title: System fault injection and reconciliation
  closure_unit: Disk-full, low-memory, corrupt/locked-profile, database-outage, event-loss/reorder, and interrupted-migration injections each
    preserve truth, prevent false success, and enter a documented recovery path.
  requirement_ids:
  - STAGE-REQ-RECOVERY-003
  source_ids:
  - STAGE-PRES-PORT-006
  release_ids:
  - STAGE-WIN-BOOTSTRAP-PROD
  - STAGE-WP-COMPLETE
  production_gate_ids:
  - STAGE-GATE-013-FAILURE-RECOVERY
  dependency_gate_ids: []
