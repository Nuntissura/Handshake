schema_id: hsk.stage_acceptance_registry@1
registry_id: stage-acceptance-browser-core
authority: NON_AUTHORITATIVE_REFERENCE
status: SPECIFIED_UNBOUND
updated_at: "2026-07-19"
wp_id: WP-1-Handshake-Stage-MVP-v1
domains:
  - shell
  - state
  - sessions
  - authentication
  - compatibility
  - developer_testing
  - network
  - permissions
  - stage_apps
row_count: 50
command_binding_rule: >-
  UNBOUND is permitted while implementation entrypoints do not exist. Before
  execution, every UNBOUND command must be replaced by an exact non-interactive
  repository command with a zero-match guard and declared evidence outputs.

acceptance:
  - id: STAGE-ACC-SHELL-001
    title: Native omnibox classification and disclosure
    closure_unit: "URL and search inputs are classified deterministically and the selected provider and privacy impact are visible before navigation."
    requirement_ids: [STAGE-REQ-SHELL-001]
    source_ids: [STAGE-PRES-MVP-002]
    release_ids: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE]
    production_gate_ids: [STAGE-GATE-003-NATIVE-SHELL]
    dependency_gate_ids: []
    owner_lane: L05
    preconditions: [controlled-omnibox-input-corpus, search-provider-policy-bound]
    fixture_ids: [STAGE-FIX-SHELL-OMNIBOX-001]
    command_ids: [UNBOUND]
    cases:
      positive: ["Known URLs and search phrases select the correct action and expose provider/privacy state."]
      negative: ["Ambiguous or malformed input does not silently navigate or leak text to an unselected provider."]
      failure_recovery: ["Unavailable provider returns a typed error while preserving the entered text for correction."]
      concurrency: ["Parallel omnibox submissions retain distinct action IDs and cannot overwrite each other's target."]
    evidence_types: [omnibox-fixture, structured-results, visual-evidence]
    freshness_policy: { max_age: release-run, revalidation_triggers: [omnibox-parser-change, search-provider-policy-change, adapter-change] }
    pass_rule: { selected_min: 1, executed_min: 1, skipped_only_invalid: true, cleanup_required: true, redaction_scan_required: true }
    status: SPECIFIED_UNBOUND

