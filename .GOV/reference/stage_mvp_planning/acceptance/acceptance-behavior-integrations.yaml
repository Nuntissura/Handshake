acceptance:
  - id: STAGE-ACC-AGENT-001
    title: Action Observation Schema
    closure_unit: One versioned action/observation contract proves stable Stage IDs, expected-revision rejection, and engine-generation invalidation across every supported adapter.
    requirement_ids:
    - STAGE-REQ-AGENT-001
    source_ids:
    - STAGE-DEC-013
    - STAGE-SPEC-011
    release_ids:
    - STAGE-WIN-BOOTSTRAP-PROD
    - STAGE-WP-COMPLETE
    production_gate_ids:
    - STAGE-GATE-008-AGENT-CONTROL
    dependency_gate_ids:
    - STAGE-DEP-WP1-MODEL-ORCHESTRATION
    owner_lane: L12
    preconditions:
    - Exact Stage protocol version and adapter versions are fixed.
    - STAGE-DEP-WP1-MODEL-ORCHESTRATION is PASS for the tested baseline.
    fixture_ids:
    - STAGE-FIX-AGENT-001
    command_ids:
    - UNBOUND
    cases:
      positive:
      - Create, observe, and mutate a tab through each adapter using only stable Stage IDs and the current expected revision/generation; returned IDs and post-revisions match the persisted record.
      negative:
      - Reject an engine-native identifier, stale expected revision, missing schema version, or prior engine generation before a side effect occurs.
      failure_recovery:
      - After renderer replacement, invalidate old generation-scoped observations and reacquire a fresh observation without changing the durable Stage tab ID.
      concurrency:
      - Two actors submit the same expected revision; exactly one mutation commits and the loser receives a typed revision conflict with no partial side effect.
    evidence_types:
    - action-observation-schema
    - schema-conformance-report
    - adapter-fixture-results
    - structured-action-receipts
    freshness_policy:
      max_age: current-build-only
      build_binding: EXACT_BUILD
      fixture_binding: EXACT_FIXTURE_HASH
      dependency_binding: EXACT_CONTRACT_VERSION
      revalidation_triggers:
      - protocol-change
      - adapter-change
      - dependency-gate-change
      - fixture-change
    pass_rule:
      selected_min: 1
      executed_min: 1
      required_case_groups:
      - positive
      - negative
      - failure_recovery
      - concurrency
      all_cases_must_pass: true
      dependency_gates_must_pass: true
      skipped_only_invalid: true
      cleanup_required: true
      redaction_scan_required: true
      semantic_rule: All supported adapters pass the positive, negative, recovery, and concurrency cases with no native-ID leakage and the dependency gate PASS evidence is fresh.
    status: SPECIFIED_UNBOUND
  - id: STAGE-ACC-AGENT-002
    title: Timeout Side Effect Suite
    closure_unit: A crash/timeout fault suite proves durable intent precedes every browser side effect and every uncertain outcome is reconciled to a recorded postcondition before retry.
    requirement_ids:
    - STAGE-REQ-AGENT-002
    source_ids:
    - STAGE-PRES-MVP-005
    - STAGE-PRES-MVP-010
    - STAGE-SPEC-011
    release_ids:
    - STAGE-WIN-BOOTSTRAP-PROD
    - STAGE-WP-COMPLETE
    production_gate_ids:
    - STAGE-GATE-008-AGENT-CONTROL
    dependency_gate_ids: []
    owner_lane: L12
    preconditions:
    - Intent, attempt, result, and reconciliation records have fixed schemas.
    - Fault injection can stop execution before and after the external side effect.
    fixture_ids:
    - STAGE-FIX-AGENT-002
    command_ids:
    - UNBOUND
    cases:
      positive:
      - Persist intent, execute one navigation/action, and record a verified postcondition linked by correlation and causation IDs.
      negative:
      - Prevent execution when durable intent cannot commit, and prevent blind retry while an earlier outcome remains uncertain.
      failure_recovery:
      - Kill the adapter after the side effect but before acknowledgement; restart reconciles observed state and records completed, compensated, or safely retryable without duplication.
      concurrency:
      - Concurrent retries with one idempotency key converge on one effect and one canonical result while retaining all attempt receipts.
    evidence_types:
    - timeout-side-effect-suite
    - fault-injection-report
    - event-ledger-proof
    - reconciliation-receipts
    freshness_policy:
      max_age: current-build-only
      build_binding: EXACT_BUILD
      fixture_binding: EXACT_FIXTURE_HASH
      dependency_binding: NOT_APPLICABLE
      revalidation_triggers:
      - intent-schema-change
      - retry-policy-change
      - fixture-change
    pass_rule:
      selected_min: 1
      executed_min: 1
      required_case_groups:
      - positive
      - negative
      - failure_recovery
      - concurrency
      all_cases_must_pass: true
      dependency_gates_must_pass: true
      skipped_only_invalid: true
      cleanup_required: true
      redaction_scan_required: true
      semantic_rule: Every fault point preserves intent-before-effect ordering and converges to an evidenced postcondition without duplicate consequential effects.
    status: SPECIFIED_UNBOUND
