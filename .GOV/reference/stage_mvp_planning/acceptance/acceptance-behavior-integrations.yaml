  - id: STAGE-ACC-AGENT-004
    title: Concurrent Agent Suite
    closure_unit: A parallel-actor run proves fenced leases, revision checks, bounded queues, cancellation, recoverable receipts, and zero foreground focus theft under contention.
    requirement_ids:
    - STAGE-REQ-AGENT-004
    source_ids:
    - STAGE-SPEC-011
    release_ids:
    - STAGE-WIN-BOOTSTRAP-PROD
    - STAGE-WP-COMPLETE
    production_gate_ids:
    - STAGE-GATE-008-AGENT-CONTROL
    dependency_gate_ids:
    - STAGE-DEP-WP1-MODEL-ORCHESTRATION
    owner_lane: L12
    preconditions:
    - Lease duration, fencing token, queue bounds, cancellation deadline, and foreground-focus invariant are fixed.
    - STAGE-DEP-WP1-MODEL-ORCHESTRATION is PASS.
    fixture_ids:
    - STAGE-FIX-AGENT-004
    command_ids:
    - UNBOUND
    cases:
      positive:
      - Multiple actors operate disjoint tabs concurrently and receive attributable receipts without exceeding queue or lease limits.
      negative:
      - Reject expired/fenced leases, stale revisions, queue overflow, and unauthorized focus-changing actions with typed results.
      failure_recovery:
      - Cancel and kill an actor mid-action; ownership expires/reaps, uncertain work reconciles, and another actor resumes from durable state.
      concurrency:
      - Contend on one tab and across windows; fencing permits one owner per protected mutation, preserves fairness, and never activates a foreground window.
    evidence_types:
    - concurrent-agent-suite
    - parallel-agent-report
    - lease-ledger
    - queue-metrics
    - focus-trace
    - cancellation-reap-receipts
    freshness_policy:
      max_age: current-build-only
      build_binding: EXACT_BUILD
      fixture_binding: EXACT_FIXTURE_HASH
      dependency_binding: EXACT_CONTRACT_VERSION
      revalidation_triggers:
      - lease-policy-change
      - queue-policy-change
      - wp1-contract-change
      - fixture-change
    pass_rule:
      selected_min: 1
      executed_min: 1
      required_case_groups:
      - positive
      - negative
      - failure_recovery
      - concurrency
      all_cases_must_pass: true
      dependency_gates_must_pass: true
      skipped_only_invalid: true
      cleanup_required: true
      redaction_scan_required: true
      semantic_rule: All contention and recovery cases remain bounded, attributable, cancellable, focus-safe, and free of stale-owner side effects with a fresh dependency PASS.
    status: SPECIFIED_UNBOUND
