  - { id: STAGE-REQ-STATE-009, domain: state, priority: P1, requirement: "Duplicate suggestions never silently delete distinct state, notes, ordering, history, or artifacts.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L06, evidence: duplicate-safety-suite }

