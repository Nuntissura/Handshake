coverage_gates:
  - id: STAGE-REQ-GATE-ORPHANS
    rule: "No requirement lacks a lane, release, evidence type, future seed, and acceptance gate."
  - id: STAGE-REQ-GATE-PRESERVATION
    rule: "Every STAGE-PRES and STAGE-DEC row has an explicit current disposition before stub consolidation; reaffirmed outcomes map to current STAGE-REQ IDs, while superseded lineage is covered by the supersession requirements or an explicit rejection planning contract."
  - id: STAGE-REQ-GATE-SPEC
    rule: "Every STAGE-SPEC conflict maps to one or more STAGE-REQ IDs before Master Spec authoring."
  - id: STAGE-REQ-GATE-ACTIVE-WP
    rule: "Every active-WP dependency has a versioned consumer fixture, entry gate, unavailable behavior, and revalidation trigger."
  - id: STAGE-REQ-GATE-MT
    rule: "Official MT generation fails on orphan requirements, cycles, duplicate IDs, file conflicts, missing commands, missing negative cases, or missing status-sync surfaces."
