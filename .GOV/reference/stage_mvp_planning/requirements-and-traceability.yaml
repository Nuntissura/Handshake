  - { id: STAGE-REQ-AUTH-001, domain: authentication, priority: P0, requirement: "Authenticated-site compatibility is journey-tested; embedded Google OAuth is recorded as blocked in WebView2.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: auth-compatibility-matrix }
  - { id: STAGE-REQ-AUTH-002, domain: authentication, priority: P0, requirement: "Native-app OAuth uses an external user-agent with PKCE and an explicit redirect/deep-link contract.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: rfc8252-oauth-fixture }
  - { id: STAGE-REQ-AUTH-003, domain: authentication, priority: P0, requirement: "OAuth API tokens are not misrepresented as arbitrary website cookies or website login state.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: token-cookie-separation-tests }
  - { id: STAGE-REQ-AUTH-004, domain: authentication, priority: P0, requirement: "Engine-native login, external OAuth, governed cookie import, and unsupported/degraded paths are explicit per site.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: session-acquisition-policy }
  - { id: STAGE-REQ-AUTH-005, domain: authentication, priority: P0, requirement: "Passkey/WebAuthn, password/autofill, HTTP auth, proxy auth, and client-certificate behavior are qualified without a Stage raw-password vault.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: credential-method-matrix }
