  - { id: STAGE-REQ-DOWNLOAD-002, domain: downloads, priority: P0, requirement: "Disk-full, access, path, network, server, authorization, certificate, hash, policy, malware, and scan failures are distinct.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L15, evidence: download-failure-matrix }
  - { id: STAGE-REQ-DOWNLOAD-003, domain: downloads, priority: P0, requirement: "Governed downloads detach from tab lifetime and route to Media Downloader/ArtifactStore with lineage.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L15, evidence: renderer-kill-download-continuation }
