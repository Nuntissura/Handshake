  - { id: STAGE-REQ-DOWNLOAD-005, domain: downloads, priority: P0, requirement: "Active downloads are never stopped, paused, frozen, or made dormant by tab suspend/unload/archive, resource budgets, machine-wide ceilings, window/tab close, or session dormancy; renderer-bound downloads keep their carrier renderer exempt from suspend/unload until completion or durable job handoff.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L15, evidence: download-lifecycle-immunity }

  - { id: STAGE-REQ-PERM-001, domain: permissions, priority: P0, requirement: "Every engine permission kind passes through a default-deny per-origin/session broker.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L10, evidence: permission-broker-negative-suite }
  - { id: STAGE-REQ-PERM-002, domain: permissions, priority: P0, requirement: "Allow-once, allow-session, persistent allow/deny, expiry, reset, and receipts are supported.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L10, evidence: site-settings-round-trip }
  - { id: STAGE-REQ-PERM-003, domain: permissions, priority: P0, requirement: "New windows, popups, external schemes, and protocol handlers require Stage-owned policy and destination visibility.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L10, evidence: popup-and-scheme-suite }
