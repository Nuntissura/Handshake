  - { id: STAGE-REQ-SHELL-007, domain: shell, priority: P1, requirement: "View-source, developer-tools, readable-view, spellcheck, picture-in-picture, and media controls are explicit capabilities.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: optional-browser-service-matrix }
  - { id: STAGE-REQ-SHELL-008, domain: shell, priority: P0, requirement: "Stage provides native equivalents for required browser UI missing from embedded WebView2.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: webview2-gap-journeys }

