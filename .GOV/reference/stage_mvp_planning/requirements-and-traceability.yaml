stage_requirement_register:
  id: stage-requirements-and-traceability
  wp_id: WP-1-Handshake-Stage-MVP-v1
  authority: NON_AUTHORITATIVE_REFERENCE
  status: research_hardened_supersession_locked
  updated_at: "2026-07-20"
  release_slices:
    - STAGE-WIN-BOOTSTRAP-PROD
    - STAGE-SERVO-RESTRICTED-ALPHA
    - STAGE-SERVO-ARBITRARY-WEB
    - STAGE-WP-COMPLETE
  trace_rule: >-
    Before future WP or microtask generation, every requirement must map to
    at least one owning lane, acceptance gate, evidence artifact, and future
    microtask seed; no requirement may be silently deferred. Historical Stage
    sources require an explicit reaffirmed-or-superseded disposition, but old
    Stage implementation does not become a current requirement through lineage.

requirements:
  - { id: STAGE-REQ-SHELL-001, domain: shell, priority: P0, requirement: "Native omnibox distinguishes URL from search and exposes provider and privacy impact.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: omnibox-fixture }
