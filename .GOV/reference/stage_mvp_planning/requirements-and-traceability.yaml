  - { id: STAGE-REQ-STATE-003, domain: state, priority: P0, requirement: "Profile visit history supports search, filter, delete, clear-by-time, and private-mode exclusion.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L06, evidence: visit-history-suite }
  - { id: STAGE-REQ-STATE-004, domain: state, priority: P0, requirement: "Recently closed tabs/windows have bounded retention, explicit removal, ordered restore, and crash-safe persistence.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L06, evidence: recently-closed-suite }
  - { id: STAGE-REQ-STATE-005, domain: state, priority: P0, requirement: "Folders, groups, ordering, color labels, pins, bookmarks, notes, reminders, opened-from, and Loom links round trip.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L06, evidence: organization-round-trip }
