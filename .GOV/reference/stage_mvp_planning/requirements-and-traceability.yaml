  - { id: STAGE-REQ-SHELL-004, domain: shell, priority: P0, requirement: "Find-in-page, zoom, fullscreen, page audio, context menu, hover URL, and popup flows are native and capability-aware.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: browser-chrome-journeys }
  - { id: STAGE-REQ-SHELL-005, domain: shell, priority: P0, requirement: "Keyboard, command palette, pointer, drag/drop, clipboard, file chooser, touchpad, and IME routes are deterministic.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: native-input-matrix }
