  - { id: STAGE-REQ-EXPORT-003, domain: export, priority: P0, requirement: "Readable Markdown, print-page PDF, and captured-document PDF are distinct sanitized/exported operations.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L17, evidence: export-kind-suite }
  - { id: STAGE-REQ-EXPORT-004, domain: export, priority: P0, requirement: "Export is atomic, disk-agnostic, collision-aware, provenance-preserving, and uses ArtifactStore Materialize/Export authority.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L17, evidence: export-failure-recovery }

  - { id: STAGE-REQ-RESOURCE-001, domain: resources, priority: P0, requirement: "3000-plus durable records coexist with bounded live renderers and virtualized UI.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: 3000-record-benchmark }
  - { id: STAGE-REQ-RESOURCE-002, domain: resources, priority: P0, requirement: "Global, session, and window budgets reserve interactive capacity and expose deterministic admission/eviction reasons.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: scheduler-property-suite }
  - { id: STAGE-REQ-RESOURCE-003, domain: resources, priority: P0, requirement: "Unsaved input, active media/WebRTC, explicit keep-live, operator/test holds, and model leases are bounded expiring protections; pins/bookmarks/folders are metadata, and downloads protect a renderer only until durable job handoff.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: protected-work-eviction-suite }
  - { id: STAGE-REQ-RESOURCE-004, domain: resources, priority: P0, requirement: "Restore/navigation/capture/index rates prevent CPU, memory, disk, and network storms.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: restart-storm-benchmark }
  - { id: STAGE-REQ-RESOURCE-005, domain: resources, priority: P0, requirement: "Renderer attachment state and profile-level service-worker/background activity are independently modeled.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: background-activity-suite }
  - { id: STAGE-REQ-RESOURCE-006, domain: resources, priority: P0, requirement: "Unloaded/archive records create no per-record renderer, timer, watcher, poller, subscription, widget/accessibility node, decoded thumbnail, refresher, Loom-sync future, or maintenance task.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: dormant-host-work-scale-curve }
  - { id: STAGE-REQ-RESOURCE-007, domain: resources, priority: P0, requirement: "Machine-wide renderer/background-work ceilings, reserved interactive capacity, fairness, expiry, and why-awake attribution remain effective across simultaneous windows and sessions.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: multi-window-resource-scheduler-suite }
  - { id: STAGE-REQ-RESOURCE-008, domain: resources, priority: P0, requirement: "Tree flattening, filtering, counts, search, accessibility, drag/drop, and bulk projections use incremental invalidation or bounded paging and do not hide per-frame/per-event full-record walks behind row virtualization.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: projection-allocation-profile }
  - { id: STAGE-REQ-RESOURCE-009, domain: resources, priority: P0, requirement: "Service workers, utilities, GPU processes, workflow jobs, migration/reindex, thumbnails, backup, capture, ArtifactStore maintenance, and diagnostics are independently attributed, bounded, cancellable, and never invoked per tab or sidebar refresh.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L07, evidence: background-service-attribution-suite }

  - { id: STAGE-REQ-RECOVERY-001, domain: recovery, priority: P0, requirement: "Browser, renderer, GPU, network, profile, and host failures have deduplicated state machines and bounded retry.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L21, evidence: process-failure-injection }
  - { id: STAGE-REQ-RECOVERY-002, domain: recovery, priority: P0, requirement: "Crash-loop breaker, quarantine, safe-mode restore, operator choices, and orphan cleanup are production journeys.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L21, evidence: crash-loop-safe-mode }
  - { id: STAGE-REQ-RECOVERY-003, domain: recovery, priority: P0, requirement: "Disk full, low memory, corrupt/locked profile, database outage, event loss/reorder, and interrupted migration are fault-injected.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L21, evidence: system-fault-matrix }
  - { id: STAGE-REQ-RECOVERY-004, domain: recovery, priority: P0, requirement: "Backups restore canonical records/artifacts first; raw live browser UDFs are not canonical backup authority.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L21, evidence: clean-machine-restore }

  - { id: STAGE-REQ-ACCESS-001, domain: accessibility, priority: P0, requirement: "Native and embedded focus/accessibility models support keyboard-only and screen-reader completion.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: uia-narrator-journeys }
  - { id: STAGE-REQ-ACCESS-002, domain: accessibility, priority: P0, requirement: "High contrast, text scaling, zoom, reduced motion, DPI, multi-monitor, IME, and no-overlap behavior are visually verified.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: accessibility-visual-matrix }
  - { id: STAGE-REQ-I18N-001, domain: localization, priority: P0, requirement: "Stable resource IDs, BCP-47 locales, fallback/plurals, RTL, locale sort/search, pseudo-localization, and long strings are supported.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: localization-fixture }
  - { id: STAGE-REQ-I18N-002, domain: localization, priority: P0, requirement: "Engine locale, Accept-Language, translation language, search collation, and error/manual locale stay coherent per session.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: locale-coherence-suite }
  - { id: STAGE-REQ-MANUAL-001, domain: manual, priority: P0, requirement: "UserManual covers install, run, navigation, sessions, auth gaps, permissions, model control, capture, updates, backup, diagnostics, and recovery.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: no-context-manual-journeys }
  - { id: STAGE-REQ-MANUAL-002, domain: manual, priority: P0, requirement: "No-context models discover stable action IDs, state, health, receipts, screenshots, failures, and evidence without chat history.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L18, evidence: model-usability-journeys }

  - { id: STAGE-REQ-RELEASE-001, domain: release, priority: P0, requirement: "WebView2 production bootstrap and Servo promotion have distinct non-deceptive gates.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-SERVO-RESTRICTED-ALPHA, STAGE-WP-COMPLETE], lane: L22, evidence: promotion-gate-registry }
  - { id: STAGE-REQ-RELEASE-002, domain: release, priority: P0, requirement: "Servo arbitrary-web Windows is security-blocked until effective content-process sandbox and escape tests pass.", releases: [STAGE-SERVO-ARBITRARY-WEB, STAGE-WP-COMPLETE], lane: L09, evidence: servo-sandbox-proof }
  - { id: STAGE-REQ-RELEASE-003, domain: release, priority: P0, requirement: "Install, repair, upgrade, uninstall, missing/offline runtime, non-admin, enterprise policy, x64/ARM64, and retained-data behavior are tested.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L20, evidence: windows-packaging-matrix }
  - { id: STAGE-REQ-RELEASE-004, domain: release, priority: P0, requirement: "Runtime/engine/app updates have version qualification, state-preserving restart, forward-compatibility, kill switches, and owned rollback semantics.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L20, evidence: update-rollback-drill }
  - { id: STAGE-REQ-RELEASE-005, domain: release, priority: P0, requirement: "All engines, crates, native binaries, codecs, lists, models, and runtime assets have pins, hashes, SBOM, notices, advisory policy, signing, and update owner.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L20, evidence: supply-chain-manifest }
  - { id: STAGE-REQ-RELEASE-006, domain: release, priority: P0, requirement: "Production support bundle is redacted, bounded, versioned, operator-reviewable, and correlates state, events, processes, profiles, and evidence.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L21, evidence: diagnostic-bundle-secret-scan }

  - { id: STAGE-REQ-SUPERSESSION-001, domain: supersession, priority: P0, requirement: "The current Stage contract is the sole Stage product authority and supersedes every older Stage-specific requirement, implementation, prototype, adapter, connector, route, pane, schema, mockup, and test surface regardless of build status.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L01, evidence: legacy-stage-disposition-audit }
  - { id: STAGE-REQ-SUPERSESSION-002, domain: supersession, priority: P0, requirement: "Old Stage assets may be salvaged only after direct conformance to current requirements with no legacy compatibility concession; real operator data receives an explicit retain/export/one-way-import/delete disposition without preserving old Stage runtime authority.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: supersession-and-data-disposition-proof }

  - { id: STAGE-REQ-WP1-001, domain: active_wp, priority: P0, requirement: "WP-1 owns model lanes, ToolGate, process cancellation/reap, promotion, EventLedger, Flight Recorder, and Argus; Stage is a versioned consumer.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: wp1-ownership-contract }
  - { id: STAGE-REQ-WP1-002, domain: active_wp, priority: P0, requirement: "Dependent production gates bind to a validated future WP-1 baseline and do not treat current dirty/failed state as proven.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: wp1-entry-gate }
  - { id: STAGE-REQ-WP12-001, domain: active_wp, priority: P0, requirement: "WP-12 Stage routes, aliases, wire types, panes, connectors, adapters, schemas, and mockups are superseded; any editor integration is a new consumer of the current Stage public contract.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: wp12-legacy-surface-removal }
  - { id: STAGE-REQ-WP12-002, domain: active_wp, priority: P0, requirement: "WP-12 duplicate 16KiB storage and stage.jobs.enqueue authority are removed; real operator data, if present, receives a verified one-way import into ArtifactStore and current tool/capability contracts.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: wp12-data-disposition-and-import }
  - { id: STAGE-REQ-WP12-003, domain: active_wp, priority: P0, requirement: "WP-12 0341/0346/0348/0349 migrations and cross-table guards receive collision-safe replacement/removal and optional one-way data import, with no presumed legacy compatibility window.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L19, evidence: legacy-stage-removal-rehearsal }
  - { id: STAGE-REQ-WP12-004, domain: active_wp, priority: P0, requirement: "The new full Stage module is canonical; the WP-12 Stage pane and ModuleId placeholder are superseded and removed or replaced, not retained as compatibility clients.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L05, evidence: worksurface-supersession-proof }

