  - { id: STAGE-REQ-SESSION-002, domain: sessions, priority: P0, requirement: "Cookies, cache, storage, IndexedDB, service workers, permissions, history, and preferences are isolated and clearable by profile.", releases: [STAGE-WIN-BOOTSTRAP-PROD, STAGE-WP-COMPLETE], lane: L11, evidence: cross-profile-leak-suite }
