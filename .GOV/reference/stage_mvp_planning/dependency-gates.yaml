      - ../handshake_main/src/backend/handshake_core/src/kernel/product_screenshot_capture.rs
    gap: >-
      Current spec and product code use incompatible rich, URI, and
      artifact_id/path representations. Stage cannot select or mint an encoding.
    entry_criteria:
      - "One canonical structured serialized ArtifactHandle and version are selected globally."
      - "ArtifactStore, Downloader, Atelier/CKC, Workflow, Export/Materialize, and Stage fixtures use the same encoding."
      - "Stage treats the handle as opaque and never reads a path or constructs an artifact URI."
      - "Migration/compatibility behavior for existing real handles is explicit."
