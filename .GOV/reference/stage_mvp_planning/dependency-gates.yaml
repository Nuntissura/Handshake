  - id: STAGE-DEP-ARTIFACT-STREAMING
    dependency: Shared ArtifactStore streamed ingest and bounded reads
    dependency_ref: { kind: SHARED_SERVICE, id: ArtifactService }
    dependency_wp: WP-1-Artifact-System-Foundations-v1
    owner: SHARED_ARTIFACT_SYSTEM_OWNER_UNASSIGNED
    consumer: StageCaptureCoordinator
    current_state: BLOCKED_MISSING_PRODUCTION_API
    required_contract_version: UNBOUND
    baseline_commit: UNBOUND
    baseline_dirty_state: UNBOUND
    baseline_diff_hash: null
    observed_head: 6519f4e2827840642a6c0401ac31055469f09d3b
    observed_dirty_state: DECLARED_DIRTY
    observed_dirty_entries: 2
    validator_state: BLOCKED
    required_green_checks: [large-media-stream-stress, disk-full-and-cancel, uncertain-finalize-reconcile, orphan-cleanup, bounded-memory-profile]
    fake_contract_version: NOT_APPLICABLE
    current_evidence:
      - ../handshake_main/src/backend/handshake_core/src/storage/mod.rs
      - ../handshake_main/src/backend/handshake_core/src/storage/retention.rs
      - ../handshake_main/src/backend/handshake_core/src/workflows.rs
    gap: >-
      Shared storage writes/materialization are whole-buffer-oriented while the
      Media Downloader contains a separate streaming writer. Large Stage media,
      PDF, WARC, and multi-part captures need one shared bounded ingest contract.
    entry_criteria:
      - "Versioned begin/write/finalize/abort/reconcile ingest contract exists."
      - "Hashing is incremental and bytes are not reread solely to recompute the same digest."
      - "Buffers, concurrency, checkpoints, and EventLedger writes are bounded and backpressured."
      - "Atomic idempotent finalize returns canonical ArtifactHandle plus observed stat."
      - "Orphan staging cleanup, range/stream reads, and materialization by handle are implemented."
      - "Artifact retention/health scans are incremental, pausable, and outside Stage startup/sidebar paths."
    unavailable_behavior: { code: STAGE_ARTIFACT_STREAMING_UNAVAILABLE, preserves: [manual-browsing, tab-organization, small-capability-query], blocks: [large-capture-success, governed-batch-download-success] }
    failure_behavior: "Large capture/download jobs fail or pause visibly before unbounded buffering; Stage never creates a parallel store."
    revalidation_triggers: [artifact-ingest-api-change, hash-policy-change, retention-change, materialize-api-change]
    requirement_ids: [STAGE-REQ-CAPTURE-004, STAGE-REQ-CAPTURE-008, STAGE-REQ-RESOURCE-009]
    acceptance_ids: [STAGE-ACC-CAPTURE-004, STAGE-ACC-CAPTURE-008, STAGE-ACC-RESOURCE-009]
    production_gate_ids: [STAGE-GATE-009-HIGH-VOLUME, STAGE-GATE-010-DOWNLOAD-CAPTURE, STAGE-GATE-011-DOWNSTREAM]
    required_evidence: [large-media-stream-stress, disk-full-and-cancel, uncertain-finalize-reconcile, orphan-cleanup, bounded-memory-profile]
    checked_at: "2026-07-19"

