    failure_behavior: "Stage capture/download/intake integration remains disabled with a typed dependency-unavailable result."
    revalidation_triggers: [artifact-schema-change, storage-api-change, downloader-contract-change, atelier-intake-change]
    requirement_ids: [STAGE-REQ-CAPTURE-006, STAGE-REQ-CAPTURE-007, STAGE-REQ-WP12-002]
    acceptance_ids: [STAGE-ACC-CAPTURE-006, STAGE-ACC-CAPTURE-007, STAGE-ACC-WP12-002]
    production_gate_ids: [STAGE-GATE-010-DOWNLOAD-CAPTURE, STAGE-GATE-011-DOWNSTREAM, STAGE-GATE-012-MIGRATION]
    required_evidence: [cross-system-handle-round-trip, malformed-handle-negative-suite, real-data-migration-proof]
