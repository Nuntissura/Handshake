    owner: SHARED_ARTIFACT_SYSTEM_OWNER_UNASSIGNED
    consumer: StageCaptureCoordinator
    current_state: BLOCKED_CONTRACT_DRIFT
    required_contract_version: UNBOUND
    baseline_commit: UNBOUND
    baseline_dirty_state: UNBOUND
    baseline_diff_hash: null
    observed_head: 6519f4e2827840642a6c0401ac31055469f09d3b
    observed_dirty_state: DECLARED_DIRTY
    observed_dirty_entries: 2
    validator_state: BLOCKED
    required_green_checks: [cross-system-handle-round-trip, malformed-handle-negative-suite, real-data-migration-proof]
    fake_contract_version: NOT_APPLICABLE
    current_evidence:
