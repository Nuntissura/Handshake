stage_dependency_gates:
  schema_id: hsk.stage_dependency_gate_registry@1
  registry_id: stage-dependency-gates
  id: stage-dependency-gates
  authority: NON_AUTHORITATIVE_REFERENCE
  status: blockers_explicit
  updated_at: "2026-07-19"
  wp_id: WP-1-Handshake-Stage-MVP-v1
  rule: >-
    Stage production code and official microtasks may not consume a dependency
    until its required baseline, contract version, owner, validator state,
    failure behavior, and evidence are bound here and the gate is PASS.
    A planning description or existing code reference is not a passed gate.
  pass_validation_rules:
    - "PASS is illegal when required_contract_version or baseline_commit is UNBOUND."
    - "PASS is illegal when owner, consumer, validator_state, required checks, unavailable behavior, or evidence is absent."
    - "A DECLARED_DIRTY baseline requires baseline_diff_hash and exact dirty-diff evidence; observed dirty state is never an approved baseline."
    - "Any required green check that is missing, failed, skipped-only, stale, or from another commit keeps the gate blocked."
    - "A changed revalidation trigger makes prior PASS evidence STALE until rerun."
    - "Orphan requirement, acceptance, production-gate, owner, or dependency references are validation failures."

