closure_requirements:
  - exact_source_and_target_commits_bound
  - all_readers_writers_routes_types_tables_indexes_triggers_guards_tests_and_ui_rows_inventory_complete
  - real_operator_data_decision_recorded
  - migration_numbers_and_file_conflict_owner_reserved_after_rebase
  - clean_database_and_populated_database_rehearsals_pass
  - optional_import_bounded_idempotent_restartable_and_count_hash_verified
  - legacy_writers_stopped_before_cutover
  - no_unapproved_legacy_alias_reader_writer_or_compatibility_window
