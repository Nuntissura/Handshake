legacy_stage_disposition:
  id: stage-legacy-disposition-register
  authority: NON_AUTHORITATIVE_REFERENCE
  status: inventory_seed_exact_baseline_and_real_data_pending
  updated_at: "2026-07-19"
  wp_id: WP-1-Handshake-Stage-MVP-v1
  operator_decision: STAGE-DEC-017
  allowed_dispositions: [REMOVE, REPLACE, SALVAGE_CODE_ONLY, ONE_WAY_DATA_IMPORT]
  forbidden_default: COMPATIBILITY_RETENTION
  rule: >-
    Existing implementation, adapter, connector, schema, route, pane, mockup,
    test, or built status does not grant authority. Code salvage requires direct
    conformance to the new contract. Real operator data is inventoried separately
    and may receive a verified one-way import without preserving legacy runtime.

surfaces:
  - id: STAGE-LEGACY-001
    surface: StagePane
    kind: ui_pane
    disposition: REPLACE
    replacement: canonical_native_stage_module
    real_data_possible: false
    proof: [new-stage-worksurface-canonical, old-pane-unregistered, no-alias-navigation]

  - id: STAGE-LEGACY-002
    surface: ModuleId::Stage placeholder behavior
    kind: shell_registry_placeholder
    disposition: REPLACE
    replacement: canonical_native_stage_module_registration
    real_data_possible: false
