stage_pillar_compatibility:
  id: stage-pillar-compatibility-matrix
  authority: NON_AUTHORITATIVE_REFERENCE
  status: proposed_complete_24_pillar_declaration
  updated_at: "2026-07-19"
  wp_id: WP-1-Handshake-Stage-MVP-v1
  current_spec: .GOV/spec/master-spec-v02.201
  navigation_reference: .GOV/spec/HANDSHAKE_PRODUCT_REFERENCE.md
  navigation_reference_role: REFERENCE_ONLY_NOT_AUTHORITY
  rule: >-
    Every pillar has an explicit Stage relationship and ownership boundary.
    DIRECT_INTEGRATION does not transfer authority into Stage. GOVERNANCE_ONLY
    does not create a runtime dependency. No edge is approved product authority
    until propagated through the later Master Spec and work-packet workflow.

pillars:
  - id: STAGE-PILLAR-001
    pillar_no: 1
    name: Flight Recorder
    status: DIRECT_INTEGRATION
    stage_contract: "Emit bounded business/action/job/policy correlation and receipts; preserve trace IDs across Stage, Workflow, capture, and intake."
    ownership_boundary: "Flight Recorder is diagnostic projection, never Stage state/EventLedger/PostgreSQL authority and never a raw page/secret payload sink."
    required_evidence: [event-family-registration, trace-correlation-replay, secret-and-payload-bound-tests]
    current_gap: "The current FEAT-STAGE appendix lacks the complete EventLedger/Flight Recorder edge and tier split."

  - id: STAGE-PILLAR-002
    pillar_no: 2
    name: Calendar
    status: INDIRECT_OPTIONAL_PROJECTION
    stage_contract: "Stage visits, captures, jobs, and operator/model activity may expose stable activity references for shared temporal correlation."
    ownership_boundary: "Calendar owns time-structured views; Stage owns browser records and does not create calendar events implicitly."
    required_evidence: [activity-reference-schema, no-implicit-calendar-mutation]
    current_gap: "No required operator workflow currently depends on Calendar; retain as an explicit optional edge."

  - id: STAGE-PILLAR-003
    pillar_no: 3
    name: Code editor
    status: PUBLIC_CONSUMER_AND_TEST_TARGET
    stage_contract: "Open authorized local/self-hosted builds for browser testing; return versioned observations, screenshots, traces, and capture handles through a newly specified public contract."
    ownership_boundary: "The editor owns documents/builds; Stage owns browser execution/capture and does not reuse WP-12 legacy Stage routes or panes."
    required_evidence: [new-editor-stage-contract, local-test-profile-negative-suite, embed-back-lineage]
    current_gap: "WP-12 editor integration must be specified anew after legacy Stage surface removal."

  - id: STAGE-PILLAR-004
    pillar_no: 4
    name: Rich-text / Word clone
    status: PUBLIC_CONSUMER
    stage_contract: "Consume Stage-captured readable/Markdown/PDF artifacts and provenance through shared handles; optional embed-back uses the new public editor contract."
    ownership_boundary: "Rich-text owns document blocks and edits; Stage never becomes document authority."
    required_evidence: [sanitized-document-handoff, immutable-source-and-derivation-proof]
    current_gap: "No current canonical embed-back contract is bound."

  - id: STAGE-PILLAR-005
    pillar_no: 5
    name: Excel clone
    status: OPTIONAL_PUBLIC_CONSUMER
    stage_contract: "Consume explicit structured exports or capture artifacts through shared handles when spreadsheet workflows request them."
    ownership_boundary: "Spreadsheet owns cells/formulas/documents; Stage does not infer spreadsheet ingestion or mutate workbooks."
    required_evidence: [typed-export-handoff, no-direct-document-write]
    current_gap: "No P0 Stage workflow depends on spreadsheet integration."

  - id: STAGE-PILLAR-006
    pillar_no: 6
    name: Locus
    status: GOVERNANCE_AND_READINESS_PROJECTION
    stage_contract: "Project Stage work, incidents, release readiness, and stable Stage/job/evidence references into Locus where the product workflow selects it."
    ownership_boundary: "Locus records coordination/readiness; Stage, Workflow, EventLedger, and ArtifactStore remain product/job/byte authorities."
    required_evidence: [stable-reference-projection, no-duplicate-state-authority]
    current_gap: "The current Stage appendix lacks an explicit Locus edge."

  - id: STAGE-PILLAR-007
    pillar_no: 7
    name: Loom
    status: DIRECT_INTEGRATION
    stage_contract: "Link tab folders/views/bookmarks/captures to LoomBlocks, tags, mentions, backlinks, pins, collections, and retrieval without waking pages."
    ownership_boundary: "Stage owns operational tab organization; Loom owns durable knowledge relationships and semantic graph identities."
    required_evidence: [folder-loom-authority-consistency, captured-content-indexing, no-duplicate-tag-graph]
    current_gap: "Exact folder/tag/view synchronization and conflict behavior remains to be locked."

  - id: STAGE-PILLAR-008
    pillar_no: 8
    name: Work packets (product)
    status: GOVERNANCE_ONLY
    stage_contract: "The later Stage implementation is governed by one consolidated WP/refinement and may expose stable work/evidence references to product views."
    ownership_boundary: "Work-packet lifecycle/signature authority is external to Stage runtime."
    required_evidence: [single-wp-lineage, requirement-to-microtask-trace]
    current_gap: "Official consolidated WP/refinement is intentionally deferred until planning and Master Spec authoring."

  - id: STAGE-PILLAR-009
    pillar_no: 9
    name: Task board (product)
    status: GOVERNANCE_ONLY
    stage_contract: "Later Stage WP/MT status projects to the canonical task board; Stage runtime does not own task status."
    ownership_boundary: "Task-board state remains the governed projection outside Stage product data."
    required_evidence: [wp-mt-taskboard-status-sync]
    current_gap: "No official Stage WP/MT rows exist yet by operator decision."

  - id: STAGE-PILLAR-010
    pillar_no: 10
    name: MicroTask
    status: DIRECT_EXECUTION_CONSUMER
    stage_contract: "No-context MT agents invoke typed Stage actions through WP-1 ToolGate/Workflow and receive bounded observations, receipts, screenshots, and evidence."
    ownership_boundary: "MicroTask executor owns claim/validate/escalate; Stage owns browser actions and cannot bypass WP-1 gates."
    required_evidence: [canonical-microtask-schema-binding, no-context-stage-journeys, cancellation-and-recovery]
    current_gap: "The future MT blueprint is not yet compiled into canonical hsk.microtask_contract@1 records."

  - id: STAGE-PILLAR-011
    pillar_no: 11
    name: Command Center (DCC)
    status: DIRECT_OPERATIONAL_INTEGRATION
    stage_contract: "Expose Stage sessions, jobs, approvals, agent/takeover state, resource budgets, why-awake reasons, captures, failures, and evidence through stable projections."
    ownership_boundary: "DCC is an operator visibility/control surface; Stage remains record/runtime authority."
    required_evidence: [dcc-stage-health-projection, approval-and-takeover-flow, resource-hotlist]
    current_gap: "Existing appendix edge is incomplete for the expanded Stage resource/capture/model contract."

  - id: STAGE-PILLAR-012
    pillar_no: 12
    name: Front End Memory System
    status: DIRECT_BOUNDED_CONTEXT_INTEGRATION
    stage_contract: "Provide bounded provenance-first browser observations and action outcomes for front-end model context without persisting arbitrary live-page state."
    ownership_boundary: "FEMS owns bounded model memory; Stage owns canonical browser records and page data remains hostile input."
    required_evidence: [bounded-context-pack, provenance-and-staleness-labels, no-secret-or-unbounded-page-memory]
    current_gap: "The current FEAT-STAGE appendix omits this edge."

  - id: STAGE-PILLAR-013
    pillar_no: 13
    name: Execution / Job Runtime
    status: CORE_SHARED_DEPENDENCY
    stage_contract: "Compile capture, download, ASR, translation, export, browser-test, and model-control work into versioned Workflow/AI Job profiles with durable cancellation/recovery."
    ownership_boundary: "WP-1 owns ModelSession, ToolGate, process supervision, cancellation/reap, promotion, EventLedger, telemetry, and runtime scheduling."
    required_evidence: [wp1-entry-gate-pass, workflow-profile-registry, renderer-kill-job-continuation]
    current_gap: "Active WP-1 is not validated on the required baseline; Stage production agent control remains dependency-blocked."

  - id: STAGE-PILLAR-014
    pillar_no: 14
    name: Spec to prompt
    status: ADJACENT_MODEL_WORKFLOW
    stage_contract: "Stage may execute browser tests/captures requested by compiled spec prompts and return versioned evidence/artifact handles."
    ownership_boundary: "Spec-to-prompt owns deterministic prompt envelopes; Stage neither compiles prompts nor changes capability snapshots."
    required_evidence: [compiled-request-to-stage-action-trace, evidence-return-contract]
    current_gap: "No explicit current appendix edge."

  - id: STAGE-PILLAR-015
    pillar_no: 15
    name: PostgreSQL + CRDT authority
    status: CORE_SHARED_DEPENDENCY
    stage_contract: "Persist canonical window/session/tab/folder/action/capture/bulk/outbox state in PostgreSQL/EventLedger with versioned revisions, idempotency, fencing, and deterministic projectors."
    ownership_boundary: "Browser profiles, renderer memory, UI rows, indexes, and ArtifactStore are not Stage record authority; CRDT is used only where the approved collaboration contract requires it."
    required_evidence: [schema-and-migration-registry, replay-and-projector-rebuild, concurrency-property-suite]
    current_gap: "Current Stage appendix still contains SQLite-era posture and must be replaced."

  - id: STAGE-PILLAR-016
    pillar_no: 16
    name: LLM-friendly data
    status: DIRECT_PRODUCT_REQUIREMENT
    stage_contract: "Expose versioned actions, observations, health, receipts, capabilities, state, errors, screenshots, and manual routes for no-context models."
    ownership_boundary: "Structured model surfaces are projections over canonical product state and never private hidden authority."
    required_evidence: [no-context-model-journeys, stable-id-and-schema-registry, bounded-payload-tests]
    current_gap: "Current appendix model exposure is OPERATOR_ONLY and contradicts the locked local/cloud AI workflow."

  - id: STAGE-PILLAR-017
    pillar_no: 17
    name: Stage
    status: SELF_OWNER
    stage_contract: "Own the native governed browser/webviewer, durable high-volume workspace, hostile-web boundary, Stage Apps, capture initiation, model browser control, and Stage-specific diagnostics."
    ownership_boundary: "Stage does not absorb shared execution, artifact, downloader, ASR, Loom, editor, Studio, CKC, Atelier/Lens, or governance authority."
    required_evidence: [complete-stage-requirement-register, release-slice-gates, legacy-supersession-proof]
    current_gap: "Master Spec and appendices require the later full Stage rewrite."

  - id: STAGE-PILLAR-018
    pillar_no: 18
    name: Studio
    status: DOWNSTREAM_CONSUMER_AND_RECIPROCAL_INTEGRATION
    stage_contract: "Send captured/imported visual assets and provenance through shared handles; optionally open Studio outputs in Stage for governed preview/test/review."
    ownership_boundary: "Studio owns visual authoring/documents; Stage owns web I/O, browser capture, inspection, and handoff."
    required_evidence: [versioned-stage-studio-envelope, round-trip-correlation, no-authority-absorption]
    current_gap: "The public reciprocal contract is not yet bound to a current implementation baseline."

  - id: STAGE-PILLAR-019
    pillar_no: 19
    name: Atelier/Lens
    status: PRIMARY_DOWNSTREAM_CONSUMER
    stage_contract: "Submit persistent project-intake batches using shared ArtifactHandles, source/capture lineage, idempotency, per-item dispositions, retry/cancel, and progress."
    ownership_boundary: "Atelier/Lens/CKC owns consumer media/review/domain data; consumers cannot access Stage tables, profiles, cookies, or engine IDs."
    required_evidence: [new-atelier-ckc-intake-endpoint, per-item-disposition-suite, source-tab-to-intake-lineage]
    current_gap: "No current Stage-ready public artifact-batch intake endpoint exists; a new consumer-owned adapter is required."

  - id: STAGE-PILLAR-020
    pillar_no: 20
    name: Skill distillation / LoRA
    status: OPTIONAL_DOWNSTREAM_EVIDENCE_CONSUMER
    stage_contract: "Governed Stage action/evidence traces may become review-gated distillation candidates through existing pipelines."
    ownership_boundary: "Stage does not select training data, train adapters, promote models, or weaken browser-data sensitivity controls."
    required_evidence: [explicit-review-gate, provenance-preserving-export, no-automatic-training-ingest]
    current_gap: "No P0 Stage release dependency; keep optional and policy-gated."

  - id: STAGE-PILLAR-021
    pillar_no: 21
    name: ACE
    status: DIRECT_MODEL_CONTEXT_INTEGRATION
    stage_contract: "Compile bounded WorkingContext from Stage state/observations/manual/capabilities and return attributable action/evidence results for local/cloud agents."
    ownership_boundary: "ACE owns per-call context compilation; Stage owns browser state/actions and page content never gains instruction authority."
    required_evidence: [working-context-budget, prompt-injection-and-exfiltration-suite, stale-target-rejection]
    current_gap: "Current appendix lacks the full ACE/model-control edge."

  - id: STAGE-PILLAR-022
    pillar_no: 22
    name: RAG
    status: CAPTURED_CONTENT_CONSUMER
    stage_contract: "Index and retrieve captured/ingested content with source kind, capture time, provenance, staleness, and Loom relations without waking or refetching pages."
    ownership_boundary: "RAG/Loom owns retrieval indexes and evidence ranking; Stage owns source tab/capture lineage and live-page truth labels."
    required_evidence: [zero-page-activity-search, captured-content-truth-labels, deterministic-index-rebuild]
    current_gap: "Exact semantic-query and retention boundary remains to be locked."

  - id: STAGE-PILLAR-023
    pillar_no: 23
    name: internal_diagnostics
    status: CORE_DIAGNOSTIC_INTEGRATION
    stage_contract: "Expose typed allowlisted heartbeat, UI/frame time, CPU/RSS/GPU, renderer/background-process maps, queue depth, why-awake, failures, and recovery state."
    ownership_boundary: "Internal diagnostics records no project/sensitive page data and supplements rather than replaces Flight Recorder."
    required_evidence: [diagnostic-allowlist, resource-scale-curve, visual-debug-and-health-panel]
    current_gap: "Current Stage appendix lacks the expanded high-volume/background-work diagnostics edge."

  - id: STAGE-PILLAR-024
    pillar_no: 24
    name: Palmistry
    status: CORE_EXTERNAL_WATCHER_INTEGRATION
    stage_contract: "External watcher observes Stage host freeze/crash/heavy-CPU heartbeat, process/resource summaries, and minidump references without depending on the frozen UI."
    ownership_boundary: "Palmistry records typed non-sensitive diagnostics only; it does not read tab/page/project payloads or become Stage recovery authority."
    required_evidence: [host-freeze-and-heavy-cpu-drill, minidump-and-heartbeat-correlation, sensitive-data-negative-test]
    current_gap: "Current Stage appendix lacks the explicit out-of-process heavy-CPU/watchdog edge."

