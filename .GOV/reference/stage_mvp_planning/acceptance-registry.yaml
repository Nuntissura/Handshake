schema_id: hsk.stage_acceptance_registry_index@1
registry_id: stage-acceptance-registry

stage_acceptance_registry:
  id: stage-acceptance-registry
  authority: NON_AUTHORITATIVE_REFERENCE
  status: atomic_rows_specified_command_and_runtime_bindings_pending
  updated_at: "2026-07-20"
  wp_id: WP-1-Handshake-Stage-MVP-v1
  requirement_source: requirements-and-traceability.yaml
  production_gate_source: production-gates.yaml
  dependency_gate_source: dependency-gates.yaml
  expected_requirement_count: 117
  expected_atomic_acceptance_count: 117
  resolution_rule: >-
    For every requirement row, acceptance_id is STAGE-ACC- plus the suffix of
    requirement_id, lane_id and evidence_id come from the requirement row,
    release_ids come from releases, production_gate_ids are the union of the
    domain default and explicit requirement override, and dependency_gate_ids
    are the reverse lookup of every dependency-gates.yaml requirement_ids list.
    Generation fails on an unknown domain, missing evidence/lane/release,
    unknown gate, duplicate requirement, or unresolved dependency reference.

acceptance_shards:
  - id: STAGE-ACCEPTANCE-SHARD-BROWSER-CORE
    path: .GOV/reference/stage_mvp_planning/acceptance/acceptance-browser-core.yaml
    expected_rows: 50
    domains: [shell, state, sessions, authentication, compatibility, developer_testing, network, permissions, stage_apps]
  - id: STAGE-ACCEPTANCE-SHARD-BEHAVIOR-INTEGRATIONS
    path: .GOV/reference/stage_mvp_planning/acceptance/acceptance-behavior-integrations.yaml
    expected_rows: 43
    domains: [agent, capture, downloads, intake, search, export, resources]
  - id: STAGE-ACCEPTANCE-SHARD-OPERATIONS-GOVERNANCE
    path: .GOV/reference/stage_mvp_planning/acceptance/acceptance-operations-governance.yaml
    expected_rows: 24
    domains: [accessibility, localization, manual, recovery, release, active_wp, supersession]

atomic_row_contract:
  required_fields:
    - id
    - closure_unit
    - requirement_ids
    - source_ids
    - release_ids
    - production_gate_ids
    - dependency_gate_ids
    - owner_lane
    - preconditions
    - fixture_ids
    - command_ids
    - cases
    - evidence_types
    - freshness_policy
    - pass_rule
    - status
  cardinality_rules:
    - "Every acceptance row owns exactly one requirement ID."
    - "Every requirement ID appears in exactly one acceptance row across all shards."
    - "Acceptance ID is STAGE-ACC- plus the suffix of its requirement ID."
    - "Every row contains non-empty positive, negative, failure_recovery, and concurrency case groups."
    - "Every referenced source, release, production gate, and dependency gate resolves."
    - "UNBOUND command IDs keep the row SPECIFIED_UNBOUND and cannot produce PASS."

