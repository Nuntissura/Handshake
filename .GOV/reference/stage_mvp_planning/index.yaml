  - id: STAGE-PLAN-HIGH-VOLUME-TABS
    title: "High-Volume Tabs and Resource Lifecycle"
    status: active
    depends_on: [STAGE-PLAN-OPERATOR-OUTCOMES, STAGE-PLAN-SESSIONS-STATE, STAGE-PLAN-RENDERER-ARCHITECTURE]
    primary_files:
      - .GOV/reference/stage_mvp_planning/04-operator-outcomes-and-use-cases.md
      - .GOV/reference/stage_mvp_planning/05-native-frontend-and-tab-workspace.md
      - .GOV/reference/stage_mvp_planning/09-acceptance-benchmarks-and-red-team.md
      - .GOV/reference/stage_mvp_planning/research/notes/STAGE-RW-011-high-volume-tab-lifecycle.md
      - .GOV/reference/stage_mvp_planning/research/notes/STAGE-RW-022-high-volume-tab-cpu-memory-spike.md
    source_files:
      - .GOV/reference/stage_mvp_planning/research/source-register.yaml
    research_workstreams: [STAGE-RW-011, STAGE-RW-022]
    spike_result: >-
      STAGE-RW-022 harness built+run 2026-07-20. Core "3000+ tabs without taxing CPU" architecture EMPIRICALLY
      VALIDATED at resource level: 3000 records + 0 live renderers = 22 MB / ~0% CPU; RAM tracks live-renderer
      ceiling K not record count N (flat ~450 MB light / ~1.26 GB YouTube at K=3 whether 10 or 10000 tabs);
      idle CPU ~0 everywhere. vs operator's live Firefox 3000 tabs = 3.88 GB, Stage model at 3 live YouTube
      renderers = 1.26 GB (~3x less, ~2.6 GB more headroom for ComfyUI/editors). Open (increment 2):
      load-storm CPU, GPU, and virtualized egui sidebar per-frame cost.
    outputs:
      - active-suspended-unloaded-archived-lifecycle
      - machine-wide-live-and-background-work-ceilings
      - metadata-only-pins-and-expiring-keep-live-contract
      - zero-per-record-dormant-host-work-contract
      - incremental-projection-and-virtualized-tab-sidebar-contract
      - multi-window-fairness-and-why-awake-diagnostics
      - lazy-session-restore-contract
      - cache-site-data-and-tab-state-retention-policy
      - 1-to-10000-scale-curve-and-mandatory-3000-plus-tab-fixture
    verification:
      - "Idle CPU and live renderer count do not scale as if every persisted tab were active."
      - "Bulk operations and search use the canonical tab set rather than rendered sidebar rows."
      - "Unloaded tabs perform no page timers, media playback, background fetches, or indexing."
      - "Unloaded records create no proportional host timers, tasks, subscriptions, widgets, decoded thumbnails, refresh work, or shared-store scans."
      - "Multiple windows and pinned records cannot multiply or bypass the machine-wide ceiling."
      - "No lifecycle mechanism ever stops, pauses, freezes, or makes dormant an active download; renderer-bound downloads protect their carrier renderer until completion or durable handoff (STAGE-DEC-019)."

