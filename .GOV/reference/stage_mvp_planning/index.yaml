  purpose: >-
    Single machine-readable index for every Stage planning topic and every
    currently identified Stage planning, authority, source-stub, dependency,
    downstream-consumer, and research file.
  completeness: FULL_FEATURE_AND_PRODUCTION_CONTRACT_CORPUS
  completeness_note: >-
    The current planning/governance corpus, Stage-related current spec,
    selected active WP contracts, protected product reuse surfaces, WP-12
    legacy Stage prototype/migrations and supersession plan, full browser-product requirements,
    production data/security/operations contracts, 24-Pillar compatibility,
    and future authoring requirements have been inspected or drafted. Active
    dependency gates now explicitly block ArtifactHandle/streaming convergence,
    WP-1 validation, WP-12 removal/migration, CKC/Atelier public intake, and
    Downloader v0/v2 convergence. All 117 requirements now resolve one-to-one
    to atomic acceptance rows, and the future allocator conforms to the canonical
    microtask schema. Operator-locked STAGE-DEC-019 (unconditional download
    continuity) and STAGE-DEC-020 (normal-browser baseline; complexity only for
