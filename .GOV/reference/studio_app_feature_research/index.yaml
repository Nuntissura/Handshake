# Research paper index - Studio app feature inventory for Handshake Studio rebuild.
# Machine-readable map over per-topic files in this folder.

research_paper:
  id: handshake-studio-app-feature-research
  feature_name: Studio
  title: "Handshake Studio - Photoshop, Affinity, InDesign, Illustrator, and Figma Feature Inventory"
  purpose: >-
    Reference inventory of Photoshop, Affinity Photo/Designer/Publisher, InDesign,
    Illustrator, and Figma app behavior for rebuilding equivalent capability as
    local-first, no-cloud-required, Handshake-native Rust tools inside the built-in
    Studio module.
  status: "draft - category maps, generated official-help leaf indexes, plus per-app deep-feature deltas (51-55) below help-TOC level, a Handshake integration architecture (56), and a generated deep-delta cross-app overlap map (57)"
  updated_at: "2026-07-09"
  repo: Handshake
  location: ".GOV/reference/studio_app_feature_research/"
  instruction_file: "INSTRUCTIONS.md"
  authority_note: "Reference/landscape material only. Not a Work Packet, Master Spec, validator gate, or implementation authority."
  source_policy: "Prefer official vendor help/product/developer pages; mark uncertain or blocked claims UNVERIFIED."
  naming_policy: "Vendor product names are source/provenance and compatibility references only; shipped Studio tools, commands, panels, and manual topics use Handshake-native names."
  file_format_policy: "Preserve compatibility with existing creative file formats through explicit import/export contracts and fixtures; do not invent a replacement interchange format for this rebuild scope."
  provider_offline_policy: "Provider, cloud, AI, collaboration, community, hosted API, and compatibility behavior remains documented, but built-in Studio behavior is local-first with optional adapters, deterministic fallbacks, receipts, and offline verification."

header_convention:
  topic_header: "## [<TOPIC_ID>] <Title>"
  subtopic_header: "### [<TOPIC_ID>.<suffix>] <Title>"
  frontmatter_keys: [file_id, topic_id, title, status, summary, sources, updated_at]
  feature_record_format: "Fenced YAML blocks containing stable ids, app_behavior, primitive_domain, and source_ids."
  source_location: "Every topic file ends with a sources block at EOF."

id_namespaces:
  photoshop: "Adobe Photoshop and Camera Raw features."
  affinity_photo: "Affinity Photo 2 raster/photo features."
  affinity_designer: "Affinity Designer 2 vector/design features."
  affinity_publisher: "Affinity Publisher 2 layout/publishing features."
  indesign: "Adobe InDesign layout/publishing features."
  illustrator: "Adobe Illustrator vector/illustration features."
  figma: "Figma Design, FigJam, Draw, Motion, Slides, Sites, Buzz, Make, Dev Mode, API, and collaboration features."

